ction syncAdmin(){try{const b=document.getElementById('adminBtn');if(!b||!window.s)return;const u=await user();if(!u){b.classList.add('hidden');return;}const r=await window.s.from('profiles').select('role').eq('id',u.id).maybeSingle();b.classList.toggle('hidden',!isAdmin(r.data||{},u));}catch(e){document.getElementById('adminBtn')?.classList.remove('hidden');}}function roleOptions(r){r=role(r);return ['user','editor','admin'].map(x=>`<option value="${x}" ${r===x?'selected':''}>${x}</option>`).join('');}window.adminPanel=async function(){try{const c=await requireAdmin();if(!c)return;window.S(`<section class="panel"><button onclick="dashboard()">← Volver</button><h2>Panel Admin</h2><p class="small">Sesión: ${E(c.user.email||'')}</p><div class="success"><b>Rol activo: admin</b><p>Tu cuenta está leyendo el perfil de Supabase correctamente.</p></div><div class="quick-actions"><button onclick="biblioteca()">Biblioteca</button><button onclick="tareas()">Avisos</button><button onclick="dashboard()">Acuarios</button><button onclick="adminUsuarios()">👥 Usuarios</button></div></section>`);}catch(e){window.S(`<section class="panel">${M(e.message,'error')}<button onclick="dashboard()">Volver</button></section>`);}};window.adminUsuarios=async function(){try{const c=await requireAdmin();if(!c)return;window.S(`<section class="panel"><button onclick="adminPanel()">← Volver</button><h2>Usuarios</h2>${M('Cargando perfiles desde Supabase...')}</section>`);const r=await window.s.from('profiles').select('id,display_name,role,created_at').order('created_at',{ascending:false});if(r.error)throw r.error;const data=r.data||[];const total=data.length,admins=data.filter(p=>role(p.role)==='admin').length,editores=data.filter(p=>role(p.role)==='editor').length,users=data.filter(p=>role(p.role)==='user').length;const rows=data.map(p=>`<div class="item"><h3>${E(p.display_name||'Sin nombre')}</h3><p class="small">Rol: <b>${E(role(p.role))}</b> · Creado: ${E(fecha(p.created_at))}</p><label>Rol</label es desde Supabase...')}</section>`,'microfauna');try{const aqR=await window.s.from('aquariums').select('id,name').eq('user_id',u.id).order('created_at',{ascending:false});const culR=await window.s.from('microfauna_cultures').select('id,name,culture_type,aquarium_id,next_action_at,status,notes,created_at').eq('user_id',u.id).order('created_at',{ascending:false}).limit(120);if(culR.error)throw culR.error;const map={};(aqR.data||[]).forEach(a=>map[a.id]=a.name);const data=culR.data||[];const activos=data.filter(c=>!['done','closed','archived'].includes(String(c.status||'active').toLowerCase()));const avisos=data.filter(c=>c.next_action_at);const vencidos=avisos.filter(c=>{const d=new Date(c.next_action_at);return !isNaN(d)&&d<Date.now();});R(`<section class="summary-card"><div><small>Microfauna</small><h2>${data.length} cultivos</h2><p>${activos.length} activos · ${avisos.length} con aviso · ${vencidos.length} vencidos</p></div><button onclick="formMicrofauna()">+</button></section><section class="panel"><div class="panel-head"><div><h2>Cultivos</h2><p class="small">Copepodos, rotíferos, artemia, fitoplancton e infusorios.</p></div><button class="primary" onclick="formMicrofauna()">Nuevo</button></div>${data.map(c=>microCard(c,map)).join('')||M('No hay cultivos todavía.')}</section>`,'microfauna');}catch(e){R(`<section class="panel"><h2>Microfauna</h2>${M(e.message,'error')}<button class="primary" onclick="formMicrofauna()">Crear cultivo</button></section>`,'microfauna');}};window.formMicrofauna=async function(){const u=await user();if(!u){window.login&&window.login();return;}const aqR=await window.s.from('aquariums').select('id,name').eq('user_id',u.id).order('created_at',{ascending:false});const opts='<option value="">General</option>'+(aqR.data||[]).map(a=>`<option value="${E(a.id)}">${E(a.name)}</option>`).join('');R(`<section class="panel"><button onclick="microfauna()">← Volver</button><h2>Nuevo cultivo</h2><label>Nombre</label><input id="mfName" placeholder="Ej. Copepodos principal"><label>Tipo</label><select id="mfType"><option value="copepodos">Copepodos</option><option value="rotiferos">Rotíferos</option><option value="artemia">Artemia</option><option value="fitoplancton">Fitoplancton</option><option value="infusorios">Infusorios</option><option value="otro">Otro</option></select><label>Acuario</label><select id="mfAq">${opts}</select><label>Próxima acción</label><input id="mfNext" type="datetime-local"><label>Notas</label><textarea id="mfNotes" placeholder="Densidad, alimentación, cosecha, reinicio..."></textarea><button class="primary" onclick="saveMicrofauna()">Guardar cultivo</button><div id="x"></div></section>`,'microfauna');};window.saveMicrofauna=async function(){try{const u=await user();if(!u)throw new Error('Debes iniciar sesión.');if(!val('mfName'))throw new Error('Pon un nombre al cultivo.');const row={user_id:u.id,aquarium_id:val('mfAq')||null,name:val('mfName'),culture_type:val('mfType')||'otro',next_action_at:val('mfNext')?new Date(val('mfNext')).toISOString():null,status:'active',notes:val('mfNotes')||null};const r=await window.s.from('microfauna_cultures').insert(row);if(r.error)throw r.error;await window.microfauna();}catch(e){const x=document.getElementById('x');if(x)x.innerHTML=M(e.message,'error');}};window.microfaunaHecha=async function(id){try{const r=await window.s.from('microfauna_cultures').update({next_action_at:null,status:'active'}).eq('id',id);if(r.error)throw r.error;await window.microfauna();}catch(e){alert(e.message);}};document.getElementById('adminBtn')?.addEventListener('click',()=>window.adminPanel());window.addEventListener('load',()=>setTimeout(syncAdmin,800));setTimeout(syncAdmin,1200);setInterval(syncAdmin,10000);window.s?.auth?.onAuthStateChange&&window.s.auth.onAuthStateChange(()=>setTimeout(syncAdmin,300));})();</script><script src="fase1-portada-acuario.js?v=oficial-v1-biblioteca-fix-v3-20260614"></script><script src="parameters-ui.js?v=oficial-v1-biblioteca-fix-v3-20260614">
