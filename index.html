<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AcuarioNexo</title>
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="icon" href="icon-512.png">
  <script>
    window.ACUARIONEXO_BUILD = 'phase2-parameters-fallback-20260704-1440';
    window.ANX_ASSET_VERSION = window.ACUARIONEXO_BUILD + '-' + Date.now();
    (function () {
      var v = encodeURIComponent(window.ANX_ASSET_VERSION);
      var css = ['styles.css','aquarium-map.css','login-reef.css','aquarium-cards.css','aquariums-mobile-fix.css','mobile-form-fix.css','library-images.css','library-mobile-overflow-fix.css','notifications.css'];
      var manifest = document.createElement('link');
      manifest.rel = 'manifest';
      manifest.href = 'manifest.webmanifest?v=' + v;
      document.head.appendChild(manifest);
      css.forEach(function (href) {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href + '?v=' + v;
        document.head.appendChild(link);
      });
    })();
  </script>
</head>
<body>
  <header class="topbar premium-topbar">
    <div class="brand-wrap">
      <div class="brand-logo">🐠</div>
      <div><h1>Acuario<span>Nexo</span></h1><p id="version"></p></div>
    </div>
    <div class="top-actions"><button id="refreshAppBtn" class="ghost compact-refresh">↻</button><button id="logoutBtn" class="ghost hidden">Salir</button></div>
  </header>
  <main id="app"><section class="auth-card"><h2>Cargando</h2><p class="small">Abriendo AcuarioNexo...</p></section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    (async function () {
      var app = document.getElementById('app');
      var v = encodeURIComponent(window.ANX_ASSET_VERSION || (Date.now() + ''));
      var scripts = [
        'config.js','app.js','src/aquariums/aquariums-core.js','src/aquariums/aquariums-form.js','src/aquariums/aquariums-save.js','src/aquariums/aquariums.js','src/library/core/library-schema.js','src/library/ui/library.js','src/library/inventory/library-inventory-import.js','src/library/library-v3-core.js','src/library/library-v3-template.js','src/library/library-v3-images.js','src/library/library-v3-ai.js','src/library/library-v3-ficha.js','src/library/library-v3.js','src/library/ficha/ficha-chat-import.js','src/animals/animals-core.js','src/animals/animals.js','src/map/map-v3-model.js','src/map/map-state.js','src/map/map-ui.js','src/map/map-photos.js','src/map/map-markers.js','src/map/map-render-3d.js','src/map/map-save.js','src/map/map.js','src/map/map-interactions.js','src/photos/photos-core.js','src/photos/photos-form.js','src/photos/photos-save.js','src/photos/photos.js','src/inventory/inventory-core.js','src/inventory/inventory-list.js','src/inventory/inventory-form.js','src/inventory/inventory.js','src/inventory/inventory-ui.js','src/microfauna/microfauna-core.js','src/microfauna/microfauna-form.js','src/microfauna/microfauna-save.js','src/microfauna/microfauna.js','src/ai/ai.js','src/ai/ai-library-v3.js','src/ai/ai-alerts-extra.js','src/parameters/parameters-core.js','src/parameters/parameters-alert-helpers.js','src/parameters/parameters-manual.js','src/parameters/parameters.js','src/parameters/measurements-advanced.js','src/parameters/parameters-ai-fallback.js','src/tasks/tasks-core.js','src/tasks/tasks-form.js','src/tasks/tasks.js','src/admin/admin-core.js','src/admin/admin.js','src/auth/auth-core.js','src/auth/auth.js','update-manager.js','notifications.js'
      ];
      function showError(text) {
        if (!app) return;
        app.innerHTML = '<section class="auth-card"><h2>Error de carga</h2><p class="small">' + String(text || 'No se pudo cargar AcuarioNexo.') + '</p></section>';
      }
      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var script = document.createElement('script');
          script.src = src + '?v=' + v;
          script.async = false;
          script.onload = resolve;
          script.onerror = function () { reject(new Error('No se pudo cargar ' + src)); };
          document.body.appendChild(script);
        });
      }
      try {
        for (var i = 0; i < scripts.length; i += 1) await loadScript(scripts[i]);
      } catch (e) { showError(e.message); }
    })();
  </script>
</body>
</html>
