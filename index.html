<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AcuarioNexo</title>
  <link rel="manifest" href="manifest.webmanifest?v=22-05-2105">
  <link rel="apple-touch-icon" href="icon-512.png?v=22-05-2105">
  <link rel="icon" href="icon-512.png?v=22-05-2105">
  <link rel="stylesheet" href="styles.css?v=22-05-2105">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=22-05-2105"></script>
</head>
<body>
  <header class="topbar">
    <div><h1>AcuarioNexo</h1><p id="version"></p></div>
    <button id="refreshAppBtn" class="ghost">Refrescar app</button>
    <button id="logoutBtn" class="ghost hidden">Salir</button>
  </header>
  <main id="app"></main>
  <script>
    window.ACUARIONEXO_BUILD='22-05-2105';
    async function hardRefreshAcuarioNexo(){
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        if(window.caches){
          const names=await caches.keys();
          await Promise.all(names.map(n=>caches.delete(n)));
        }
      }catch(e){}
      location.replace(location.pathname+'?v='+Date.now());
    }
  </script>
  <script src="measurement-schema.js?v=22-05-2105"></script>
  <script src="measurement-ai.js?v=22-05-2105"></script>
  <script src="measurement-engine.js?v=22-05-2105"></script>
  <script src="photo-ai.js?v=22-05-2105"></script>
  <script src="app.js?v=22-05-2105"></script>
  <script src="parameters-ui.js?v=22-05-2105"></script>
</body>
</html>
