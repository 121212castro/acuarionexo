    window.ACUARIONEXO_BUILD = 'library-full-contract-audit-20260721-0035';
    window.ANX_BOOT_READY = (async function () {
      var declaredBuild = String(window.ACUARIONEXO_BUILD || 'dev');
      var activeBuild = declaredBuild;
      try {
        var response = await fetch('app-version.json?boot=' + Date.now(), { cache: 'no-store' });
        if (response.ok) {
          var payload = await response.json();
          if (payload && payload.build) activeBuild = String(payload.build);
        }
      } catch (_) {}
      window.ACUARIONEXO_BUILD = activeBuild;
      return activeBuild;
    })();
  </script>
