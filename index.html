<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>AcuarioNexo</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-512.png"><link rel="icon" href="icon-512.png"><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><header class="topbar premium-topbar"><div class="brand-wrap"><div class="brand-logo">🐠</div><div><h1>Acuario<span>Nexo</span></h1><p id="version"></p><p class="connection-pill"><i></i> Conectado a Supabase</p></div></div><div class="top-actions"><button id="adminBtn" class="ghost" onclick="adminPanel()">Admin</button><button id="refreshAppBtn" class="ghost">↻<small>Refrescar</small></button><button id="logoutBtn" class="ghost hidden">Salir</button></div></header><main id="app"></main><script>window.ACUARIONEXO_BUILD='admin-users-v3';function hardRefreshAcuarioNexo(){location.reload()}</script><script src="measurement-schema.js?v=admin-users-v3"></script><script src="measurement-ai.js?v=admin-users-v3"></script><script src="measurement-engine.js?v=admin-users-v3"></script><script src="acuarionexo-api.js?v=admin-users-v3"></script><script src="photo-ai.js?v=admin-users-v3"></script><script src="app.js?v=admin-users-v3"></script><script>(function(){const ACN_ADMIN_EMAILS=['12castro@hotmail.es'];function acnRole(role){return String(role||'user').trim().toLowerCase();}function acnIsAdmin(profile,user){return acnRole(profile&&profile.role)==='admin'||ACN_ADMIN_EMAILS.includes(String(user&&user.email||'').trim().toLowerCase());}function acnFecha(x){if(!x)return 'Sin fecha';var d=new Date(x);return isNaN(d)?'Sin fecha':d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}function acnRolOptions(role){role=acnRole(role);return ['user','editor','admin'].map(function(r){return '<option value="'+r+'" '+(role===r?'selected':'')+'>'+r+'</option>';}).join('');}async function acnRequireAdmin(){const auth=await window.s.auth.getUser();const user=auth&&auth.data&&auth.data.user;if(!user){if(window.login)window.login();return null;}const r=await window.s.from('profiles').select('role,display_name,created_at').eq('id',user.id).maybeSingle();if(r.error&&!ACN_ADMIN_EMAILS.includes(String(user.email||'').trim().toLowerCase()))throw r.error;const profile=r.data||{};if(!acnIsAdmin(profile,user))throw new Error('Acceso reservado a administradores.');return {user:user,profile:profile};}async function acnSyncAdminButton(){try{const btn=document.getElementById('adminBtn');if(!btn||!window.s)return;const auth=await window.s.auth.getUser();const user=auth&&auth.data&&auth.data.user;if(!user){btn.classList.add('hidden');return;}const r=await window.s.from('profiles').select('role,display_name,created_at').eq('id',user.id).maybeSingle();const profile=r&&r.data?r.data:{};const isAdmin=acnIsAdmin(profile,user);window.ACUARIONEXO_ROLE=isAdmin?'admin':acnRole(profile.role);btn.classList.toggle('hidden',!isAdmin);btn.onclick=function(){window.adminPanel();};}catch(e){const btn=document.getElementById('adminBtn');if(btn)btn.classList.remove('hidden');}}window.adminPanel=async function(){try{const ctx=await acnRequireAdmin();if(!ctx)return;window.S('<section class="panel"><button onclick="dashboard()">← Volver</button><h2>Panel Admin</h2><p class="small">Sesión: '+window.E(ctx.user.email||'')+'</p><div class="success"><b>Rol activo: admin</b><p>Tu cuenta está leyendo el perfil de Supabase correctamente.</p></div><div class="quick-actions"><button onclick="biblioteca()">Biblioteca</button><button onclick="tareas()">Avisos</button><button onclick="dashboard()">Acuarios</button><button onclick="adminUsuarios()">👥 Usuarios</button></div></section>');}catch(e){window.S('<section class="panel">'+window.M(e.message,'error')+'<button onclick="dashboard()">Volver</button></section>');}};window.adminUsuarios=async function(){try{const ctx=await acnRequireAdmin();if(!ctx)return;window.S('<section class="panel"><button onclick="adminPanel()">← Volver</button><h2>Usuarios</h2>'+window.M('Cargando perfiles desde Supabase...')+'</section>');const r=await window.s.from('profiles').select('id,display_name,role,created_at').order('created_at',{ascending:false});if(r.error)throw r.error;const data=r.data||[];const total=data.length;const admins=data.filter(function(p){return acnRole(p.role)==='admin';}).length;const editores=data.filter(function(p){return acnRole(p.role)==='editor';}).length;const users=data.filter(function(p){return acnRole(p.role)==='user';}).length;const stats='<section class="summary-card"><div><small>Usuarios</small><h2>'+total+' perfiles</h2><p>'+admins+' admins · '+editores+' editores · '+users+' users</p></div></section>';const rows=data.map(function(p){const id=window.E(p.id);const role=acnRole(p.role);return '<div class="item"><h3>'+(window.E(p.display_name||'Sin nombre'))+'</h3><p class="small">Rol: <b>'+window.E(role)+'</b> · Creado: '+window.E(acnFecha(p.created_at))+'</p><label>Rol</label><select id="adminRole_'+id+'">'+acnRolOptions(role)+'</select><button class="primary" onclick="adminGuardarRol(\''+id+'\')">Guardar rol</button></div>';}).join('')||window.M('No hay perfiles.');window.S(stats+'<section class="panel"><button onclick="adminPanel()">← Volver</button><div class="panel-head"><div><h2>Usuarios</h2><p class="small">Perfiles leídos desde public.profiles.</p></div></div><div class="quick-actions"><button onclick="adminUsuarios()">Refrescar</button></div>'+rows+'</section>');}catch(e){window.S('<section class="panel">'+window.M(e.message,'error')+'<button onclick="adminPanel()">Volver</button></section>');}};window.adminGuardarRol=async function(id){try{await acnRequireAdmin();const el=document.getElementById('adminRole_'+id);const role=acnRole(el&&el.value);if(!['user','editor','admin'].includes(role))throw new Error('Rol no válido.');const r=await window.s.from('profiles').update({role:role}).eq('id',id);if(r.error)throw r.error;await window.adminUsuarios();}catch(e){window.S('<section class="panel">'+window.M(e.message,'error')+'<button onclick="adminUsuarios()">Volver</button></section>');}};document.getElementById('adminBtn')?.addEventListener('click',function(){window.adminPanel();});window.addEventListener('load',function(){setTimeout(acnSyncAdminButton,800);});setTimeout(acnSyncAdminButton,1200);setInterval(acnSyncAdminButton,10000);if(window.s&&window.s.auth&&window.s.auth.onAuthStateChange){window.s.auth.onAuthStateChange(function(){setTimeout(acnSyncAdminButton,300);});}})();</script><script src="fase1-portada-acuario.js?v=admin-users-v3"></script><script src="parameters-ui.js?v=admin-users-v3"></script></body></html>
