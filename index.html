<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>AcuarioNexo</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-512.png"><link rel="icon" href="icon-512.png"><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><header class="topbar premium-topbar"><div class="brand-wrap"><div class="brand-logo">🐠</div><div><h1>Acuario<span>Nexo</span></h1><p id="version"></p><p class="connection-pill"><i></i> Conectado a Supabase</p></div></div><div class="top-actions"><button id="adminBtn" class="ghost" onclick="adminPanel()">Admin</button><button id="refreshAppBtn" class="ghost">↻<small>Refrescar</small></button><button id="logoutBtn" class="ghost hidden">Salir</button></div></header><main id="app"></main><script>window.ACUARIONEXO_BUILD='microfauna-v4';function hardRefreshAcuarioNexo(){location.reload()}</script><script src="measurement-schema.js?v=microfauna-v4"></script><script src="measurement-ai.js?v=microfauna-v4"></script><script src="measurement-engine.js?v=microfauna-v4"></script><script src="acuarionexo-api.js?v=microfauna-v4"></script><script src="photo-ai.js?v=microfauna-v4"></script><script src="app.js?v=microfauna-v4"></script><script>(function(){const ACN_ADMIN_EMAILS=['12castro@hotmail.es'];function acnRole(role){return String(role||'user').trim().toLowerCase();}function acnIsAdmin(profile,user){return acnRole(profile&&profile.role)==='admin'||ACN_ADMIN_EMAILS.includes(String(user&&user.email||'').trim().toLowerCase());}function acnFecha(x){if(!x)return 'Sin fecha';var d=new Date(x);return isNaN(d)?'Sin fecha':d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}function acnRolOptions(role){role=acnRole(role);return ['user','editor','admin'].map(function(r){return '<option value="'+r+'" '+(role===r?'selected':'')+'>'+r+'</option>';}).join('');}function acnBottomNav(active){function item(id,label,icon,fn){return '<button class="'+(active===id?'active':'')+'" onclick="'+fn+'"><span>'+icon+'</span><small>'+label+'</small></button>';}return '<div style="height:140px"></div><nav class="bottom-nav">'+item('inicio','Inicio','⌂','dashboard()')+item('acuarios','Acuarios','▣','dashboard()')+item('biblioteca','Biblioteca','□','biblioteca()')+item('avisos','Avisos','♢','tareas()')+item('microfauna','Microfauna','∞','microfauna()')+'</nav>';}function acnRender(html,active){window.S(html+acnBottomNav(active||'inicio'));}function acnVal(id){return (document.getElementById(id)?.value||'').trim();}async function acnCurrentUser(){const auth=await window.s.auth.getUser();return auth&&auth.data&&auth.data.user;}async function acnRequireAdmin(){const user=await acnCurrentUser();if(!user){if(window.login)window.login();return null;}const r=await window.s.from('profiles').select('role,display_name,created_at').eq('id',user.id).maybeSingle();if(r.error&&!ACN_ADMIN_EMAILS.includes(String(user.email||'').trim().toLowerCase()))throw r.error;const profile=r.data||{};if(!acnIsAdmin(profile,user))throw new Error('Acceso reservado a administradores.');return {user:user,profile:profile};}async function acnSyncAdminButton(){try{const btn=document.getElementById('adminBtn');if(!btn||!window.s)return;const user=await acnCurrentUser();if(!user){btn.classList.add('hidden');return;}const r=await window.s.from('profiles').select('role,display_name,created_at').eq('id',user.id).maybeSingle();const profile=r&&r.data?r.data:{};const isAdmin=acnIsAdmin(profile,user);window.ACUARIONEXO_ROLE=isAdmin?'admin':acnRole(profile.role);btn.classList.toggle('hidden',!isAdmin);btn.onclick=function(){window.adminPanel();};}catch(e){const btn=document.getElementById('adminBtn');if(btn)btn.classList.remove('hidden');}}window.adminPanel=async function(){try{const ctx=await acnRequireAdmin();if(!ctx)return;window.S('<section class="panel"><button onclick="dashboard()">← Volver</button><h2>Panel Admin</h2><p class="small">Sesión: '+window.E(ctx.user.email||'')+'</p><div class="success"><b>Rol activo: admin</b><p>Tu cuenta está leyendo el perfil de Supabase correctamente.</p></div><div class="quick-actions"><button onclick="biblioteca()">Biblioteca</button><button onclick="tareas()">Avisos</button><button onclick="dashboard()">Acuarios</button><button onclick="adminUsuarios()">👥 Usuarios</button></div></section>');}catch(e){window.S('<section class="panel">'+window.M(e.message,'error')+'<button onclick="dashboard()">Volver</button></section>');}};window.adminUsuarios=async function(){try{const ctx=await acnRequireAdmin();if(!ctx)return;window.S('<section class="panel"><button onclick="adminPanel()">← Volver</button><h2>Usuarios</h2>'+window.M('Cargando perfiles desde Supabase...')+'</section>');const r=await window.s.from('profiles').select('id,display_name,role,created_at').order('created_at',{ascending:false});if(r.error)throw r.error;const data=r.data||[];const total=data.length;const admins=data.filter(function(p){return acnRole(p.role)==='admin';}).length;const editores=data.filter(function(p){return acnRole(p.role)==='editor';}).length;const users=data.filter(function(p){return acnRole(p.role)==='user';}).length;const stats='<section class="summary-card"><div><small>Usuarios</small><h2>'+total+' perfiles</h2><p>'+admins+' admins · '+editores+' editores · '+users+' users</p></div></section>';const rows=data.map(function(p){const id=window.E(p.id);const role=acnRole(p.role);return '<div class="item"><h3>'+(window.E(p.display_name||'Sin nombre'))+'</h3><p class="small">Rol: <b>'+window.E(role)+'</b> · Creado: '+window.E(acnFecha(p.created_at))+'</p><label>Rol</label><select id="adminRole_'+id+'">'+acnRolOptions(role)+'</select><button class="primary" onclick="adminGuardarRol(\''+id+'\')">Guardar rol</button></div>';}).join('')||window.M('No hay perfiles.');window.S(stats+'<section class="panel"><button onclick="adminPanel()">← Volver</button><div class="panel-head"><div><h2>Usuarios</h2><p class="small">Perfiles leídos desde public.profiles.</p></div></div><div class="quick-actions"><button onclick="adminUsuarios()">Refrescar</button></div>'+rows+'</section>');}catch(e){window.S('<section class="panel">'+window.M(e.message,'error')+'<button onclick="adminPanel()">Volver</button></section>');}};window.adminGuardarRol=async function(id){try{await acnRequireAdmin();const el=document.getElementById('adminRole_'+id);const role=acnRole(el&&el.value);if(!['user','editor','admin'].includes(role))throw new Error('Rol no válido.');const r=await window.s.from('profiles').update({role:role}).eq('id',id);if(r.error)throw r.error;await window.adminUsuarios();}catch(e){window.S('<section class="panel">'+window.M(e.message,'error')+'<button onclick="adminUsuarios()">Volver</button></section>');}};function acnAqName(id,map){return map[id]||'General';}function acnMicroCard(c,map){const next=c.next_action_at?new Date(c.next_action_at):null;const vencida=next&&!isNaN(next)&&next<Date.now();const cls=vencida?'error':'item';return '<div class="'+cls+'"><h3>'+window.E(c.name||c.culture_type||'Cultivo')+'</h3><p class="small">'+window.E(c.culture_type||'microfauna')+' · '+window.E(acnAqName(c.aquarium_id,map))+' · '+window.E(c.status||'active')+'</p><p>Próxima acción: <b>'+window.E(acnFecha(c.next_action_at))+'</b></p>'+(c.notes?'<p>'+window.E(c.notes)+'</p>':'')+'<div class="quick-actions"><button onclick="microfaunaHecha(\''+window.E(c.id)+'\')">Acción hecha</button></div></div>';}window.microfauna=async function(){const user=await acnCurrentUser();if(!user){if(window.login)window.login();return;}acnRender('<section class="panel"><h2>Microfauna</h2>'+window.M('Cargando cultivos reales desde Supabase...')+'</section>','microfauna');try{const aqR=await window.s.from('aquariums').select('id,name').eq('user_id',user.id).order('created_at',{ascending:false});const culR=await window.s.from('microfauna_cultures').select('id,name,culture_type,aquarium_id,next_action_at,status,notes,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(120);if(culR.error)throw culR.error;const aquariums=aqR.data||[];const map={};aquariums.forEach(function(a){map[a.id]=a.name;});const data=culR.data||[];const activos=data.filter(function(c){return !['done','closed','archived'].includes(String(c.status||'active').toLowerCase());});const avisos=data.filter(function(c){return c.next_action_at;});const vencidos=avisos.filter(function(c){const d=new Date(c.next_action_at);return !isNaN(d)&&d<Date.now();});const stats='<section class="summary-card"><div><small>Microfauna</small><h2>'+data.length+' cultivos</h2><p>'+activos.length+' activos · '+avisos.length+' con aviso · '+vencidos.length+' vencidos</p></div><button onclick="formMicrofauna()">+</button></section>';const body='<section class="panel"><div class="panel-head"><div><h2>Cultivos</h2><p class="small">Copepodos, rotíferos, artemia, fitoplancton e infusorios.</p></div><button class="primary" onclick="formMicrofauna()">Nuevo</button></div>'+(data.map(function(c){return acnMicroCard(c,map);}).join('')||window.M('No hay cultivos todavía.'))+'</section>';acnRender(stats+body,'microfauna');}catch(e){acnRender('<section class="panel"><h2>Microfauna</h2>'+window.M(e.message,'error')+'<button class="primary" onclick="formMicrofauna()">Crear cultivo</button></section>','microfauna');}};window.formMicrofauna=async function(){const user=await acnCurrentUser();if(!user){if(window.login)window.login();return;}const aqR=await window.s.from('aquariums').select('id,name').eq('user_id',user.id).order('created_at',{ascending:false});const opts='<option value="">General</option>'+((aqR.data||[]).map(function(a){return '<option value="'+window.E(a.id)+'">'+window.E(a.name)+'</option>';}).join(''));acnRender('<section class="panel"><button onclick="microfauna()">← Volver</button><h2>Nuevo cultivo</h2><label>Nombre</label><input id="mfName" placeholder="Ej. Copepodos principal"><label>Tipo</label><select id="mfType"><option value="copepodos">Copepodos</option><option value="rotiferos">Rotíferos</option><option value="artemia">Artemia</option><option value="fitoplancton">Fitoplancton</option><option value="infusorios">Infusorios</option><option value="otro">Otro</option></select><label>Acuario</label><select id="mfAq">'+opts+'</select><label>Próxima acción</label><input id="mfNext" type="datetime-local"><label>Notas</label><textarea id="mfNotes" placeholder="Densidad, alimentación, cosecha, reinicio..."></textarea><button class="primary" onclick="saveMicrofauna()">Guardar cultivo</button><div id="x"></div></section>','microfauna');};window.saveMicrofauna=async function(){try{const user=await acnCurrentUser();if(!user)throw new Error('Debes iniciar sesión.');if(!acnVal('mfName'))throw new Error('Pon un nombre al cultivo.');const row={user_id:user.id,aquarium_id:acnVal('mfAq')||null,name:acnVal('mfName'),culture_type:acnVal('mfType')||'otro',next_action_at:acnVal('mfNext')?new Date(acnVal('mfNext')).toISOString():null,status:'active',notes:acnVal('mfNotes')||null};const r=await window.s.from('microfauna_cultures').insert(row);if(r.error)throw r.error;await window.microfauna();}catch(e){const x=document.getElementById('x');if(x)x.innerHTML=window.M(e.message,'error');}};window.microfaunaHecha=async function(id){try{const r=await window.s.from('microfauna_cultures').update({next_action_at:null,status:'active'}).eq('id',id);if(r.error)throw r.error;await window.microfauna();}catch(e){alert(e.message);}};document.getElementById('adminBtn')?.addEventListener('click',function(){window.adminPanel();});window.addEventListener('load',function(){setTimeout(acnSyncAdminButton,800);});setTimeout(acnSyncAdminButton,1200);setInterval(acnSyncAdminButton,10000);if(window.s&&window.s.auth&&window.s.auth.onAuthStateChange){window.s.auth.onAuthStateChange(function(){setTimeout(acnSyncAdminButton,300);});}})();</script><script src="fase1-portada-acuario.js?v=microfauna-v4"></script><script src="parameters-ui.js?v=microfauna-v4"></script></body></html>
