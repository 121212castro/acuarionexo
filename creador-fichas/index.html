<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071522">
  <title>Creador de Fichas · AcuarioNexo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <style>
    :root{--bg:#06111c;--card:#0d2032;--card2:#102a42;--txt:#eff9ff;--muted:#a7bfd1;--line:rgba(255,255,255,.12);--aqua:#56ddff;--green:#43e29b;--warn:#ffd166;--red:#ff6b6b;--shadow:0 18px 50px rgba(0,0,0,.35);--r:22px}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at top right,rgba(86,221,255,.16),transparent 34%),radial-gradient(circle at bottom left,rgba(67,226,155,.12),transparent 30%),var(--bg);color:var(--txt);padding:env(safe-area-inset-top) 0 92px;min-height:100vh}button,input,select,textarea{font:inherit}button{border:0;border-radius:16px;padding:13px 15px;background:#17324b;color:var(--txt);font-weight:750;box-shadow:inset 0 0 0 1px var(--line)}button:active{transform:scale(.98)}button.primary{background:linear-gradient(135deg,#1f93ff,#48d6ff);color:#03111c}button.good{background:linear-gradient(135deg,#23c77a,#64ebb0);color:#04140d}button.warn{background:linear-gradient(135deg,#ffb84d,#ffd166);color:#241404}button.danger{background:#4b1820;color:#ffd5d5}.wrap{max-width:980px;margin:auto;padding:16px}.hero{display:flex;gap:15px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(16,42,66,.92),rgba(8,20,32,.92));box-shadow:var(--shadow);position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:4;backdrop-filter:blur(14px)}.logo{width:64px;height:64px;border-radius:18px;background:#fff;object-fit:cover}.hero h1{font-size:22px;margin:0}.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:14px}.panel{grid-column:span 12;background:rgba(13,32,50,.88);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}.half{grid-column:span 6}.third{grid-column:span 4}.panel h2,.panel h3{margin:0 0 12px}.small{font-size:13px;color:var(--muted)}label{display:block;margin:12px 0 6px;font-size:13px;color:#cae3f5;font-weight:700}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:15px;background:#071827;color:var(--txt);padding:13px 14px;outline:none}textarea{min-height:92px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;flex-wrap:wrap}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(16,42,66,.78),rgba(8,20,32,.78));padding:14px;margin:10px 0}.card h3{margin:0 0 6px}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;margin:4px 4px 0 0;color:#d8eefb;background:rgba(255,255,255,.06);font-size:12px}.preview{white-space:pre-wrap;line-height:1.45;color:#e9f7ff}.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(4,14,22,.86);border-top:1px solid var(--line);backdrop-filter:blur(16px);z-index:5}.tabs button{font-size:12px;padding:10px 6px;border-radius:14px}.tabs button.active{background:linear-gradient(135deg,#1f93ff,#48d6ff);color:#03111c}.hidden{display:none!important}.photoPreview{width:100%;max-height:260px;object-fit:cover;border-radius:18px;border:1px solid var(--line);margin-top:10px}.empty{padding:22px;border:1px dashed rgba(255,255,255,.2);border-radius:18px;color:var(--muted);text-align:center}.notice{background:rgba(86,221,255,.1);border:1px solid rgba(86,221,255,.22);border-radius:16px;padding:12px;color:#dff8ff}.ok{background:rgba(67,226,155,.1);border-color:rgba(67,226,155,.28)}@media(max-width:760px){.wrap{padding:10px}.hero{border-radius:22px}.logo{width:54px;height:54px}.half,.third{grid-column:span 12}.row{grid-template-columns:1fr}.panel{padding:14px}.actions button{flex:1 1 auto}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <img class="logo" src="logo.svg" alt="Logo">
      <div>
        <h1>Creador de Fichas</h1>
        <p>Mini app externa · crea fichas, guárdalas localmente y expórtalas para AcuarioNexo</p>
      </div>
    </header>
    <div id="app"></div>
  </main>
  <nav class="tabs">
    <button id="tab-lista" onclick="vista('lista')">📚 Fichas</button>
    <button id="tab-nueva" onclick="nuevaFicha()">✍️ Crear</button>
    <button id="tab-importar" onclick="vista('importar')">⇄ Importar</button>
    <button id="tab-ayuda" onclick="vista('ayuda')">ℹ️ Ayuda</button>
  </nav>
<script>
const KEY='acuarionexo_creador_fichas_v1';
const app=document.getElementById('app');
let fichas=[];let actual=null;let modo='lista';
function id(){return 'ficha_'+Date.now()+'_'+Math.random().toString(16).slice(2)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function val(k){return (document.getElementById(k)?.value||'').trim()}
function load(){try{fichas=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){fichas=[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(fichas))}
function render(html){app.innerHTML=html;window.scrollTo(0,0);document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+modo)?.classList.add('active')}
function tipoTxt(t){return ({pez:'Pez',coral:'Coral',invertebrado:'Invertebrado',planta:'Planta',alga:'Alga',microfauna:'Microfauna',enfermedad:'Enfermedad',medicamento:'Medicamento',alimento:'Alimento',equipo:'Equipo',otro:'Otro'}[t]||t||'Sin tipo')}
function estadoTxt(e){return ({borrador:'Borrador',revisar:'Revisar',lista:'Lista para importar'}[e]||e||'Borrador')}
function fichaBase(){return{id:id(),estado:'borrador',tipo:'pez',nombre_comun:'',nombre_cientifico:'',familia:'',origen:'',foto:'',resumen:'',descripcion:'',tamano:'',litros_minimos:'',dificultad:'Media',temperamento:'',reef_safe:'',compatibilidad:'',alimentacion:'',parametros:'',luz:'',flujo:'',zona:'',cuidados:'',reproduccion:'',riesgos:'',observaciones:'',fuentes:'',created_at:new Date().toISOString(),updated_at:new Date().toISOString()}}
function seedTexto(f){const n=f.nombre_comun||'Esta especie';const c=f.nombre_cientifico?` (${f.nombre_cientifico})`:'';return `${n}${c}\n\nResumen\n${f.resumen||'Ficha pendiente de completar.'}\n\nDescripción y mantenimiento\n${f.descripcion||'Añade aquí una explicación práctica: comportamiento, necesidades, señales de estrés y recomendaciones de mantenimiento.'}\n\nCompatibilidad\n${f.compatibilidad||'Indica con qué especies convive bien, qué evitar y si es adecuada para comunitario, reef o acuario específico.'}\n\nAlimentación\n${f.alimentacion||'Indica dieta, frecuencia, suplementos y problemas habituales de alimentación.'}\n\nParámetros recomendados\n${f.parametros||'Añade temperatura, salinidad si procede, pH, KH, NO3, PO4 y observaciones según tipo de acuario.'}\n\nCuidados específicos\n${f.cuidados||'Añade rutinas, aclimatación, cuarentena, colocación, luz, flujo o manipulación.'}\n\nRiesgos / alertas\n${f.riesgos||'Añade agresividad, toxicidad, plagas, enfermedades frecuentes, incompatibilidades o errores habituales.'}\n\nFuentes / revisión\n${f.fuentes||'Añade fuente, web, manual, experiencia propia o pendiente de verificar.'}`}
function miniIA(){const f=getForm();if(!f.nombre_comun&&!f.nombre_cientifico){alert('Pon al menos nombre común o científico.');return}document.getElementById('resumen').value=f.resumen||`${f.nombre_comun||f.nombre_cientifico}: ficha de ${tipoTxt(f.tipo).toLowerCase()} pendiente de revisión final antes de importar a AcuarioNexo.`;document.getElementById('descripcion').value=f.descripcion||`Describe aquí cómo reconocer ${f.nombre_comun||'la especie'}, su comportamiento normal, necesidades principales y señales de que algo no va bien. Esta mini app no consulta IA externa ni Supabase: deja una estructura base para completarla con revisión propia.`;document.getElementById('compatibilidad').value=f.compatibilidad||'Compatible con animales tranquilos y parámetros estables. Revisar caso por caso antes de mezclar con especies agresivas, depredadoras o delicadas.';document.getElementById('alimentacion').value=f.alimentacion||'Indicar dieta principal, frecuencia, aceptación de seco/congelado/vivo y suplementos si proceden.';document.getElementById('parametros').value=f.parametros||'Completar temperatura, pH, dureza/KH, salinidad si es marino, nitrato, fosfato y estabilidad requerida.';document.getElementById('cuidados').value=f.cuidados||'Añadir aclimatación, cuarentena, mantenimiento, observación inicial y rutina recomendada.';document.getElementById('riesgos').value=f.riesgos||'Revisar incompatibilidades, sensibilidad a medicamentos, plagas, saltos, toxicidad, mordisqueo o daños a corales/plantas.';actual=getForm();preview();}
function getForm(){return{...(actual||fichaBase()),estado:val('estado')||'borrador',tipo:val('tipo')||'otro',nombre_comun:val('nombre_comun'),nombre_cientifico:val('nombre_cientifico'),familia:val('familia'),origen:val('origen'),foto:document.getElementById('fotoData')?.value||'',resumen:val('resumen'),descripcion:val('descripcion'),tamano:val('tamano'),litros_minimos:val('litros_minimos'),dificultad:val('dificultad'),temperamento:val('temperamento'),reef_safe:val('reef_safe'),compatibilidad:val('compatibilidad'),alimentacion:val('alimentacion'),parametros:val('parametros'),luz:val('luz'),flujo:val('flujo'),zona:val('zona'),cuidados:val('cuidados'),reproduccion:val('reproduccion'),riesgos:val('riesgos'),observaciones:val('observaciones'),fuentes:val('fuentes'),updated_at:new Date().toISOString()}}
function guardarFicha(){const f=getForm();if(!f.nombre_comun&&!f.nombre_cientifico){alert('La ficha necesita nombre común o científico.');return}const i=fichas.findIndex(x=>x.id===f.id);if(i>=0)fichas[i]=f;else fichas.unshift(f);save();actual=f;vistaDetalle(f.id)}
function eliminarFicha(fid){if(!confirm('¿Eliminar esta ficha local?'))return;fichas=fichas.filter(f=>f.id!==fid);save();vista('lista')}
function duplicarFicha(fid){const f=fichas.find(x=>x.id===fid);if(!f)return;const n={...f,id:id(),nombre_comun:f.nombre_comun+' copia',estado:'borrador',created_at:new Date().toISOString(),updated_at:new Date().toISOString()};fichas.unshift(n);save();editarFicha(n.id)}
function nuevaFicha(){modo='nueva';actual=fichaBase();render(editor(actual))}
function editarFicha(fid){const f=fichas.find(x=>x.id===fid);if(!f)return;modo='nueva';actual={...f};render(editor(actual))}
function vistaDetalle(fid){const f=fichas.find(x=>x.id===fid)||actual;if(!f)return vista('lista');modo='lista';render(`<section class="grid"><article class="panel"><div class="actions"><button onclick="vista('lista')">← Lista</button><button class="primary" onclick="editarFicha('${f.id}')">Editar</button><button onclick="duplicarFicha('${f.id}')">Duplicar</button><button class="danger" onclick="eliminarFicha('${f.id}')">Eliminar</button></div>${f.foto?`<img class="photoPreview" src="${f.foto}" alt="">`:''}<h2>${esc(f.nombre_comun||f.nombre_cientifico||'Ficha sin nombre')}</h2><p class="small">${esc(f.nombre_cientifico||'')} · ${tipoTxt(f.tipo)} · ${estadoTxt(f.estado)}</p><span class="pill">Dificultad: ${esc(f.dificultad||'-')}</span><span class="pill">Reef safe: ${esc(f.reef_safe||'-')}</span><span class="pill">Zona: ${esc(f.zona||'-')}</span><hr style="border-color:var(--line);border-width:0 0 1px;margin:16px 0"><div class="preview">${esc(seedTexto(f))}</div></article><article class="panel"><h2>Exportar esta ficha</h2><p class="small">Copia este JSON o usa Exportar todo para importarlo después en AcuarioNexo.</p><textarea readonly>${esc(JSON.stringify(f,null,2))}</textarea></article></section>`)}
function card(f){return `<article class="card"><h3>${esc(f.nombre_comun||f.nombre_cientifico||'Ficha sin nombre')}</h3><p class="small">${esc(f.nombre_cientifico||'')} · ${tipoTxt(f.tipo)} · ${estadoTxt(f.estado)}</p>${f.resumen?`<p>${esc(f.resumen.slice(0,170))}${f.resumen.length>170?'…':''}</p>`:''}<div><span class="pill">${esc(f.dificultad||'')}</span><span class="pill">${esc(f.reef_safe||'')}</span></div><div class="actions" style="margin-top:10px"><button class="primary" onclick="vistaDetalle('${f.id}')">Abrir</button><button onclick="editarFicha('${f.id}')">Editar</button></div></article>`}
function vistaLista(){modo='lista';const q=(document.getElementById('buscar')?.value||'').toLowerCase();const arr=fichas.filter(f=>!q||JSON.stringify(f).toLowerCase().includes(q));render(`<section class="grid"><article class="panel"><div class="actions"><button class="primary" onclick="nuevaFicha()">+ Nueva ficha</button><button onclick="exportarTodo()">Exportar todo</button><button onclick="descargarJSON()">Descargar JSON</button></div><label>Buscar en fichas locales</label><input id="buscar" placeholder="Buscar por nombre, tipo, texto..." value="${esc(q)}" oninput="vistaLista()"><p class="small">${fichas.length} fichas guardadas en este dispositivo. No usa Supabase.</p></article><article class="panel">${arr.length?arr.map(card).join(''):'<div class="empty">Todavía no hay fichas. Pulsa Crear.</div>'}</article></section>`)}
function editor(f){return `<section class="grid"><article class="panel"><div class="actions"><button onclick="vista('lista')">← Lista</button><button class="warn" onclick="miniIA()">Crear estructura automática</button><button class="good" onclick="guardarFicha()">Guardar ficha</button></div><h2>${f.id&&f.nombre_comun?'Editar ficha':'Nueva ficha'}</h2><div class="row"><div><label>Estado</label><select id="estado"><option value="borrador" ${f.estado==='borrador'?'selected':''}>Borrador</option><option value="revisar" ${f.estado==='revisar'?'selected':''}>Revisar</option><option value="lista" ${f.estado==='lista'?'selected':''}>Lista para importar</option></select></div><div><label>Tipo de ficha</label><select id="tipo"><option value="pez" ${f.tipo==='pez'?'selected':''}>Pez</option><option value="coral" ${f.tipo==='coral'?'selected':''}>Coral</option><option value="invertebrado" ${f.tipo==='invertebrado'?'selected':''}>Invertebrado</option><option value="planta" ${f.tipo==='planta'?'selected':''}>Planta</option><option value="alga" ${f.tipo==='alga'?'selected':''}>Alga</option><option value="microfauna" ${f.tipo==='microfauna'?'selected':''}>Microfauna</option><option value="enfermedad" ${f.tipo==='enfermedad'?'selected':''}>Enfermedad</option><option value="medicamento" ${f.tipo==='medicamento'?'selected':''}>Medicamento</option><option value="alimento" ${f.tipo==='alimento'?'selected':''}>Alimento</option><option value="equipo" ${f.tipo==='equipo'?'selected':''}>Equipo</option><option value="otro" ${f.tipo==='otro'?'selected':''}>Otro</option></select></div></div><label>Nombre común</label><input id="nombre_comun" value="${esc(f.nombre_comun)}"><label>Nombre científico</label><input id="nombre_cientifico" value="${esc(f.nombre_cientifico)}"><div class="row"><div><label>Familia / grupo</label><input id="familia" value="${esc(f.familia)}"></div><div><label>Origen / procedencia</label><input id="origen" value="${esc(f.origen)}"></div></div><label>Foto</label><input type="file" accept="image/*" onchange="cargarFoto(event)"><input type="hidden" id="fotoData" value="${esc(f.foto)}"><div id="fotoBox">${f.foto?`<img class="photoPreview" src="${f.foto}">`:''}</div><label>Resumen corto</label><textarea id="resumen">${esc(f.resumen)}</textarea><label>Descripción completa</label><textarea id="descripcion">${esc(f.descripcion)}</textarea><div class="row"><div><label>Tamaño adulto</label><input id="tamano" value="${esc(f.tamano)}"></div><div><label>Litros mínimos</label><input id="litros_minimos" value="${esc(f.litros_minimos)}"></div></div><div class="row"><div><label>Dificultad</label><select id="dificultad"><option ${f.dificultad==='Fácil'?'selected':''}>Fácil</option><option ${f.dificultad==='Media'?'selected':''}>Media</option><option ${f.dificultad==='Avanzada'?'selected':''}>Avanzada</option></select></div><div><label>Temperamento</label><input id="temperamento" value="${esc(f.temperamento)}"></div></div><label>Reef safe / plantas / compatibilidad general</label><input id="reef_safe" value="${esc(f.reef_safe)}"><label>Compatibilidad</label><textarea id="compatibilidad">${esc(f.compatibilidad)}</textarea><label>Alimentación</label><textarea id="alimentacion">${esc(f.alimentacion)}</textarea><label>Parámetros recomendados</label><textarea id="parametros">${esc(f.parametros)}</textarea><div class="row"><div><label>Luz</label><input id="luz" value="${esc(f.luz)}"></div><div><label>Flujo</label><input id="flujo" value="${esc(f.flujo)}"></div></div><label>Zona / colocación</label><input id="zona" value="${esc(f.zona)}"><label>Cuidados específicos</label><textarea id="cuidados">${esc(f.cuidados)}</textarea><label>Reproducción / propagación</label><textarea id="reproduccion">${esc(f.reproduccion)}</textarea><label>Riesgos, enfermedades o alertas</label><textarea id="riesgos">${esc(f.riesgos)}</textarea><label>Observaciones propias</label><textarea id="observaciones">${esc(f.observaciones)}</textarea><label>Fuentes / revisión</label><textarea id="fuentes">${esc(f.fuentes)}</textarea><div class="actions" style="margin-top:14px"><button class="good" onclick="guardarFicha()">Guardar ficha</button><button onclick="preview()">Vista previa</button></div></article><article class="panel"><h2>Vista previa</h2><div id="prev" class="preview">${esc(seedTexto(f))}</div></article></section>`}
function cargarFoto(ev){const file=ev.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{document.getElementById('fotoData').value=r.result;document.getElementById('fotoBox').innerHTML=`<img class="photoPreview" src="${r.result}">`};r.readAsDataURL(file)}
function preview(){const f=getForm();document.getElementById('prev').textContent=seedTexto(f)}
function exportarTodo(){const txt=JSON.stringify({app:'AcuarioNexo Creador de Fichas',version:1,exported_at:new Date().toISOString(),fichas},null,2);navigator.clipboard?.writeText(txt);alert('Exportación copiada al portapapeles. También puedes descargar el JSON.');}
function descargarJSON(){const data={app:'AcuarioNexo Creador de Fichas',version:1,exported_at:new Date().toISOString(),fichas};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='acuarionexo_fichas_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importarJSON(){try{const raw=val('importTxt');const data=JSON.parse(raw);const arr=Array.isArray(data)?data:(data.fichas||[]);if(!Array.isArray(arr))throw new Error('JSON sin lista de fichas.');const map=new Map(fichas.map(f=>[f.id,f]));arr.forEach(f=>{const clean={...f,id:f.id||id(),updated_at:new Date().toISOString()};map.set(clean.id,clean)});fichas=Array.from(map.values());save();alert('Fichas importadas: '+arr.length);vista('lista')}catch(e){alert('No pude importar: '+e.message)}}
function borrarTodo(){if(!confirm('¿Borrar todas las fichas locales de este dispositivo?'))return;fichas=[];save();vista('lista')}
function vistaImportar(){modo='importar';render(`<section class="grid"><article class="panel"><h2>Importar / Exportar</h2><p class="notice">Esta mini app trabaja fuera de AcuarioNexo y guarda en este dispositivo. Para pasar fichas a AcuarioNexo, exporta JSON y luego se importará desde el módulo correspondiente.</p><div class="actions"><button onclick="descargarJSON()">Descargar fichas</button><button onclick="exportarTodo()">Copiar JSON</button><button class="danger" onclick="borrarTodo()">Borrar locales</button></div><label>Pegar JSON para importar</label><textarea id="importTxt" placeholder="Pega aquí un JSON exportado"></textarea><button class="primary" onclick="importarJSON()">Importar JSON</button></article></section>`)}
function vistaAyuda(){modo='ayuda';render(`<section class="grid"><article class="panel"><h2>Cómo se usa</h2><div class="card"><h3>1. Crear ficha</h3><p>Rellena nombre, tipo y la información práctica. Puedes usar “Crear estructura automática” para generar una base sin IA externa.</p></div><div class="card"><h3>2. Revisar</h3><p>Marca la ficha como Borrador, Revisar o Lista para importar. Añade fuentes y observaciones propias.</p></div><div class="card"><h3>3. Exportar</h3><p>Descarga un JSON. Ese archivo será el puente para importarlo después en AcuarioNexo.</p></div><div class="card"><h3>Importante</h3><p>No usa Supabase para crear fichas y no consume IA de pago. Todo queda local hasta que exportes.</p></div></article></section>`)}
function vista(v){if(v==='lista')return vistaLista();if(v==='importar')return vistaImportar();if(v==='ayuda')return vistaAyuda();vistaLista()}
load();vista('lista');
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
