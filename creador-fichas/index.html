<style>
:root{--bg:#06111c;--panel:#0d2032;--txt:#eff9ff;--muted:#a8bfd0;--line:rgba(255,255,255,.13);--blue:#4bd7ff;--green:#56e39f;--yellow:#ffd166;--red:#ff7474;--shadow:0 18px 55px rgba(0,0,0,.34)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,rgba(75,215,255,.16),transparent 32%),radial-gradient(circle at bottom left,rgba(86,227,159,.12),transparent 30%),var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top) 0 96px}button,input,select,textarea{font:inherit}button{border:0;border-radius:16px;padding:13px 14px;background:#183752;color:var(--txt);font-weight:800;box-shadow:inset 0 0 0 1px var(--line)}button.primary{background:linear-gradient(135deg,#1f93ff,#48d6ff);color:#03111c}button.good{background:linear-gradient(135deg,#22c878,#67eeb2);color:#03140c}button.warn{background:linear-gradient(135deg,#ffb84d,#ffd166);color:#281700}button.danger{background:#4d1921;color:#ffe0e0}.wrap{max-width:1050px;margin:auto;padding:12px}.hero{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(16,42,66,.96),rgba(6,17,28,.96));box-shadow:var(--shadow);position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:4;backdrop-filter:blur(14px)}.logo{width:56px;height:56px;border-radius:18px;background:#fff}.heroText{flex:1}.hero h1{margin:0;font-size:22px}.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}.refreshBtn{white-space:nowrap;padding:11px 12px;font-size:13px}.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(4,14,22,.9);border-top:1px solid var(--line);backdrop-filter:blur(16px);z-index:5}.tabs button{font-size:12px;padding:10px 6px}.tabs button.active{background:linear-gradient(135deg,#1f93ff,#48d6ff);color:#03111c}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:14px}.panel{grid-column:span 12;background:rgba(13,32,50,.91);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow)}h2,h3{margin:0 0 12px}.small{font-size:13px;color:var(--muted)}label{display:block;margin:12px 0 6px;font-weight:800;color:#cbe4f7;font-size:13px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:15px;background:#061624;color:var(--txt);padding:13px 14px;outline:none}textarea{min-height:92px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;flex-wrap:wrap}.library{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:linear-gradient(145deg,rgba(16,42,66,.92),rgba(7,18,30,.92));box-shadow:var(--shadow)}.cover{height:172px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#061624;font-size:48px}.cover img{width:100%;height:100%;object-fit:cover}.cardBody{padding:14px}.cardBody h3{font-size:18px;margin:0 0 4px}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:6px 10px;margin:4px 4px 0 0;color:#d8eefb;background:rgba(255,255,255,.06);font-size:12px}.notice,.alert{border-left:4px solid var(--yellow);background:rgba(255,209,102,.1);padding:10px 12px;border-radius:14px;margin:10px 0;color:#ffe4a7}.notice{border-left-color:var(--blue);background:rgba(75,215,255,.1);color:#dcf8ff}.bad{border-left-color:var(--red);background:rgba(255,116,116,.1);color:#ffdada}.detailHero{display:grid;grid-template-columns:180px 1fr;gap:15px;align-items:center}.detailPhoto{width:180px;height:180px;border-radius:24px;border:1px solid var(--line);object-fit:cover;background:#061624}.section{border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;background:rgba(255,255,255,.04)}.schema{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre-wrap;background:#04101b;border:1px solid var(--line);border-radius:16px;padding:12px;max-height:360px;overflow:auto}.empty{padding:22px;border:1px dashed rgba(255,255,255,.22);border-radius:18px;color:var(--muted);text-align:center}.photoPreview{width:100%;max-height:300px;object-fit:cover;border-radius:18px;border:1px solid var(--line);margin-top:10px}@media(max-width:760px){.wrap{padding:10px}.hero{border-radius:22px}.logo{width:50px;height:50px}.hero h1{font-size:19px}.hero p{font-size:12px}.refreshBtn{padding:9px 10px;font-size:12px}.row,.detailHero{grid-template-columns:1fr}.detailPhoto{width:100%;height:230px}.actions button{flex:1 1 auto}.panel{padding:14px}}
</style>

<body>
<main class="wrap"><header class="hero"><img class="logo" src="logo.svg" alt="Logo"><div class="heroText"><h1>Creador de Fichas V4.1</h1><p>Tarjetas visuales + ficha completa + asistente IA</p></div><button class="refreshBtn" onclick="actualizarApp()">↻ Actualizar</button></header><div id="app"></div></main>
<nav class="tabs"><button id="tab-lista" onclick="vista('lista')">📚 Fichas</button><button id="tab-nueva" onclick="nueva()">✍️ Crear</button><button id="tab-ia" onclick="vista('ia')">🤖 IA</button><button id="tab-json" onclick="vista('json')">⇄ JSON</button></nav>
<script>
const KEY='acuarionexo_creador_fichas_v4';
const OLD=['acuarionexo_creador_fichas_v3','acuarionexo_creador_fichas_v2','acuarionexo_creador_fichas_v1'];
const app=document.getElementById('app');let fichas=[],actual=null,modo='lista';
const tipos={animal_pez_marino:['🐠','Pez marino','plantilla_peces_marino'],animal_pez_dulce:['🐟','Pez dulce','plantilla_peces_dulce'],animal_coral:['🪸','Coral','plantilla_corales'],animal_invertebrado:['🦐','Invertebrado','plantilla_invertebrados'],planta:['🌿','Planta','plantilla_plantas'],microfauna:['🧫','Microfauna','plantilla_microfauna'],producto:['🧴','Producto','plantilla_productos'],sal:['🧂','Sal','plantilla_productos'],test:['🧪','Test','plantilla_productos'],medicamento:['💊','Medicamento','plantilla_productos'],alimento:['🍽️','Alimento','plantilla_productos'],equipo:['⚙️','Equipo','plantilla_equipos'],guia:['📘','Guía','plantilla_guias'],otro:['📄','Otro','plantilla_general']};
async function actualizarApp(){try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){await r.unregister();}}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}}catch(e){}location.href=location.pathname+'?v='+(Date.now());}
function id(){return 'ficha_'+Date.now()+'_'+Math.random().toString(16).slice(2)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function val(k){return (document.getElementById(k)?.value||'').trim()}
function lines(t){return String(t||'').split('\n').map(x=>x.trim()).filter(Boolean)}
function csv(t){return String(t||'').split(',').map(x=>x.trim()).filter(Boolean)}
function save(){localStorage.setItem(KEY,JSON.stringify(fichas))}
function render(h){app.innerHTML=h;scrollTo(0,0);document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+modo)?.classList.add('active')}
function base(){const now=new Date().toISOString();return{schema:'acuarionexo.ficha.v4',id:id(),tipo:'animal_pez_marino',estado:'borrador',verificado:false,plantilla:'plantilla_peces_marino',tarjeta:{titulo:'',subtitulo:'',resumen:'',aviso:'',chips:[],portada:''},identificacion:{nombre_comun:'',nombre_cientifico:'',marca:'',modelo:'',fabricante:'',otros_nombres:''},clasificacion:{ambito:'marino',grupo:'',familia:'',origen:'',reef_safe:'pendiente'},detalle:{descripcion:'',uso_principal:'',observaciones:''},parametros:{temperatura:'',salinidad:'',ph:'',kh:'',gh:'',no3:'',po4:'',calcio:'',magnesio:'',otros:''},cuidados:{dificultad:'Media',tamano_adulto:'',litros_minimos:'',zona:'',luz:'',flujo:'',mantenimiento:'',aclimatacion:'',cuarentena:''},compatibilidad:{temperamento:'',compatible_con:'',evitar_con:'',corales:'',plantas:'',invertebrados:'',notas:''},alimentacion:{tipo:'',frecuencia:'',alimentos:'',suplementos:'',notas:''},producto:{categoria:'',composicion:'',dosificacion:'',modo_uso:'',precauciones:'',conservacion:'',compatibilidad:''},riesgos:{toxicidad:'',enfermedades:'',plagas:'',errores_frecuentes:'',alertas_ia:[]},ia:{resumen_para_ia:'',keywords:[],destino:'biblioteca',prioridad:'normal',busqueda_objetivo:'',fuentes_requeridas:[],puede_crear_animal:true,puede_crear_producto:false},fuentes:[],media:{foto_original:'',foto_recortada:'',portada_generada:''},created_at:now,updated_at:now}}
function normaliza(x){if(x.schema==='acuarionexo.ficha.v4')return x;let b=base();b.id=x.id||b.id;b.tipo=x.tipo||x.tipo_ficha||({pez:'animal_pez_marino',coral:'animal_coral',invertebrado:'animal_invertebrado',planta:'planta',microfauna:'microfauna',producto:'producto',equipo:'equipo'}[x.tipo]||'otro');b.plantilla=tipos[b.tipo]?.[2]||'plantilla_general';b.estado=x.estado||x.estado_revision?.estado||'borrador';b.verificado=!!(x.verificado||x.estado_revision?.verificado);b.identificacion={...b.identificacion,...(x.identificacion||{}),nombre_comun:x.nombre_comun||x.identificacion?.nombre_comun||'',nombre_cientifico:x.nombre_cientifico||x.identificacion?.nombre_cientifico||''};b.tarjeta={...b.tarjeta,...(x.tarjeta||{}),resumen:x.tarjeta?.resumen||x.tarjeta?.resumen_corto||x.resumen||x.contenido?.resumen||''};b.clasificacion={...b.clasificacion,...(x.clasificacion||{})};b.detalle.descripcion=x.detalle?.descripcion||x.contenido?.descripcion||x.descripcion||'';b.detalle.uso_principal=x.detalle?.uso_principal||x.contenido?.uso_principal||'';b.detalle.observaciones=x.detalle?.observaciones||x.contenido?.observaciones||x.observaciones||'';b.parametros={...b.parametros,...(x.parametros||{})};b.cuidados={...b.cuidados,...(x.cuidados||{})};b.compatibilidad={...b.compatibilidad,...(x.compatibilidad||{})};b.alimentacion={...b.alimentacion,...(x.alimentacion||{})};b.producto={...b.producto,...(x.producto||{})};b.riesgos={...b.riesgos,...(x.riesgos||x.riesgos_alertas||{})};b.ia={...b.ia,...(x.ia||x.ia_contexto||{})};b.fuentes=x.fuentes||x.estado_revision?.fuentes||[];b.media={...b.media,...(x.media||{}),foto_original:x.media?.foto_original||x.media?.foto||x.foto||''};return completa(b)}
function load(){try{fichas=JSON.parse(localStorage.getItem(KEY)||'[]').map(normaliza)}catch(e){fichas=[]}if(!fichas.length){for(const k of OLD){try{const o=JSON.parse(localStorage.getItem(k)||'[]');if(o.length){fichas=o.map(normaliza);save();break}}catch(e){}}}}
function titulo(f){return f.tarjeta.titulo||f.identificacion.nombre_comun||f.identificacion.nombre_cientifico||f.identificacion.marca||f.identificacion.modelo||'Ficha sin nombre'}
function subtitulo(f){return f.tarjeta.subtitulo||f.identificacion.nombre_cientifico||[f.identificacion.marca,f.identificacion.modelo].filter(Boolean).join(' ')||tipos[f.tipo]?.[1]||''}
function completa(f){f.plantilla=tipos[f.tipo]?.[2]||f.plantilla||'plantilla_general';f.tarjeta.titulo=f.tarjeta.titulo||titulo(f);f.tarjeta.subtitulo=f.tarjeta.subtitulo||subtitulo(f);f.tarjeta.resumen=f.tarjeta.resumen||f.detalle.uso_principal||f.detalle.descripcion.slice(0,155);f.tarjeta.aviso=f.tarjeta.aviso||f.riesgos.alertas_ia?.[0]||f.producto.precauciones||'';f.tarjeta.chips=f.tarjeta.chips?.length?f.tarjeta.chips:[tipos[f.tipo]?.[1],f.clasificacion.ambito,f.cuidados.dificultad,f.clasificacion.reef_safe].filter(Boolean);f.tarjeta.portada=f.media.portada_generada||f.media.foto_recortada||f.media.foto_original||f.tarjeta.portada||'';return f}
function getForm(){let f=actual?JSON.parse(JSON.stringify(actual)):base();f.tipo=val('tipo');f.plantilla=tipos[f.tipo]?.[2]||'plantilla_general';f.estado=val('estado');f.verificado=val('verificado')==='si';f.tarjeta={titulo:val('card_titulo'),subtitulo:val('card_subtitulo'),resumen:val('card_resumen'),aviso:val('card_aviso'),chips:csv(val('card_chips')),portada:document.getElementById('portadaData')?.value||''};f.identificacion={nombre_comun:val('nombre_comun'),nombre_cientifico:val('nombre_cientifico'),marca:val('marca'),modelo:val('modelo'),fabricante:val('fabricante'),otros_nombres:val('otros_nombres')};f.clasificacion={ambito:val('ambito'),grupo:val('grupo'),familia:val('familia'),origen:val('origen'),reef_safe:val('reef_safe')};f.detalle={descripcion:val('descripcion'),uso_principal:val('uso_principal'),observaciones:val('observaciones')};f.parametros={temperatura:val('temperatura'),salinidad:val('salinidad'),ph:val('ph'),kh:val('kh'),gh:val('gh'),no3:val('no3'),po4:val('po4'),calcio:val('calcio'),magnesio:val('magnesio'),otros:val('param_otros')};f.cuidados={dificultad:val('dificultad'),tamano_adulto:val('tamano_adulto'),litros_minimos:val('litros_minimos'),zona:val('zona'),luz:val('luz'),flujo:val('flujo'),mantenimiento:val('mantenimiento'),aclimatacion:val('aclimatacion'),cuarentena:val('cuarentena')};f.compatibilidad={temperamento:val('temperamento'),compatible_con:val('compatible_con'),evitar_con:val('evitar_con'),corales:val('corales'),plantas:val('plantas'),invertebrados:val('invertebrados'),notas:val('compat_notas')};f.alimentacion={tipo:val('alim_tipo'),frecuencia:val('frecuencia'),alimentos:val('alimentos'),suplementos:val('suplementos'),notas:val('alim_notas')};f.producto={categoria:val('prod_categoria'),composicion:val('composicion'),dosificacion:val('dosificacion'),modo_uso:val('modo_uso'),precauciones:val('precauciones'),conservacion:val('conservacion'),compatibilidad:val('prod_compat')};f.riesgos={toxicidad:val('toxicidad'),enfermedades:val('enfermedades'),plagas:val('plagas'),errores_frecuentes:val('errores'),alertas_ia:lines(val('alertas_ia'))};f.ia={resumen_para_ia:val('resumen_ia'),keywords:csv(val('keywords')),destino:val('destino'),prioridad:val('prioridad'),busqueda_objetivo:val('busqueda_objetivo'),fuentes_requeridas:lines(val('fuentes_requeridas')),puede_crear_animal:val('crear_animal')==='si',puede_crear_producto:val('crear_producto')==='si'};f.fuentes=lines(val('fuentes'));f.media={foto_original:document.getElementById('fotoData')?.value||'',foto_recortada:'',portada_generada:document.getElementById('portadaData')?.value||''};f.updated_at=new Date().toISOString();return completa(f)}
function guardar(){let f=getForm();if(titulo(f)==='Ficha sin nombre'){alert('Pon título, nombre, marca o modelo.');return}let i=fichas.findIndex(x=>x.id===f.id);if(i>=0)fichas[i]=f;else fichas.unshift(f);save();actual=f;detalle(f.id)}
function nueva(){modo='nueva';actual=base();render(editor(actual))}
function editar(i){let f=fichas.find(x=>x.id===i);if(!f)return;actual=JSON.parse(JSON.stringify(f));modo='nueva';render(editor(actual))}
function borrar(i){if(confirm('¿Eliminar ficha?')){fichas=fichas.filter(x=>x.id!==i);save();vista('lista')}}
function duplicar(i){let f=JSON.parse(JSON.stringify(fichas.find(x=>x.id===i)));f.id=id();f.tarjeta.titulo=titulo(f)+' copia';f.estado='borrador';f.created_at=new Date().toISOString();f.updated_at=f.created_at;fichas.unshift(f);save();editar(f.id)}
function icon(f){return tipos[f.tipo]?.[0]||'📄'}
function card(f){return `<article class="card" onclick="detalle('${f.id}')"><div class="cover">${f.tarjeta.portada?`<img src="${f.tarjeta.portada}">`:icon(f)}</div><div class="cardBody"><h3>${esc(titulo(f))}</h3><p class="small">${esc(subtitulo(f))}</p><p>${esc(f.tarjeta.resumen||'Sin resumen corto.')}</p><div>${(f.tarjeta.chips||[]).slice(0,4).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>${f.tarjeta.aviso?`<div class="alert">${esc(f.tarjeta.aviso)}</div>`:''}<div class="actions" style="margin-top:10px"><button class="primary" onclick="event.stopPropagation();detalle('${f.id}')">Ver ficha</button><button onclick="event.stopPropagation();editar('${f.id}')">Editar</button></div></div></article>`}
function vistaLista(){modo='lista';let q=(document.getElementById('buscar')?.value||'').toLowerCase();let a=fichas.filter(f=>!q||JSON.stringify(f).toLowerCase().includes(q));render(`<section class="grid"><article class="panel"><div class="actions"><button class="primary" onclick="nueva()">+ Nueva ficha</button><button onclick="descargar()">Descargar JSON</button><button onclick="copiarExport()">Copiar JSON</button><button onclick="actualizarApp()">↻ Actualizar app</button></div><label>Buscar</label><input id="buscar" value="${esc(q)}" placeholder="pez, coral, producto, marca, uso..." oninput="vistaLista()"><p class="small">Tarjeta corta por fuera. Ficha completa al abrir. Esquema V4 limpio.</p></article><article class="panel"><div class="library">${a.length?a.map(card).join(''):'<div class="empty">Sin fichas todavía.</div>'}</div></article></section>`)}
function p(k,v){return v?`<p><b>${k}:</b> ${esc(v)}</p>`:''}
function sec(t,h){return `<div class="section"><h3>${t}</h3>${h||'<p class="small">Sin datos.</p>'}</div>`}
function detalle(i){let f=fichas.find(x=>x.id===i)||actual;if(!f)return;modo='lista';render(`<section class="grid"><article class="panel"><div class="actions"><button onclick="vista('lista')">← Fichas</button><button class="primary" onclick="editar('${f.id}')">Editar</button><button onclick="duplicar('${f.id}')">Duplicar</button><button onclick="copiarPrompt('${f.id}')">Prompt IA</button><button onclick="actualizarApp()">↻ Actualizar</button><button class="danger" onclick="borrar('${f.id}')">Eliminar</button></div><div class="detailHero">${f.tarjeta.portada?`<img class="detailPhoto" src="${f.tarjeta.portada}">`:`<div class="detailPhoto" style="display:flex;align-items:center;justify-content:center;font-size:60px">${icon(f)}</div>`}<div><h2>${esc(titulo(f))}</h2><p class="small">${esc(subtitulo(f))}</p>${(f.tarjeta.chips||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}${f.tarjeta.aviso?`<div class="alert">${esc(f.tarjeta.aviso)}</div>`:''}</div></div>${sec('Resumen visible',p('Resumen',f.tarjeta.resumen)+p('Tipo',tipos[f.tipo]?.[1])+p('Plantilla',f.plantilla))}${sec('Identificación',p('Nombre común',f.identificacion.nombre_comun)+p('Nombre científico',f.identificacion.nombre_cientifico)+p('Marca',f.identificacion.marca)+p('Modelo',f.identificacion.modelo)+p('Fabricante',f.identificacion.fabricante)+p('Otros nombres',f.identificacion.otros_nombres))}${sec('Descripción y uso',p('Descripción',f.detalle.descripcion)+p('Uso principal',f.detalle.uso_principal)+p('Observaciones',f.detalle.observaciones))}${sec('Parámetros',p('Temperatura',f.parametros.temperatura)+p('Salinidad',f.parametros.salinidad)+p('pH',f.parametros.ph)+p('KH',f.parametros.kh)+p('GH',f.parametros.gh)+p('NO3',f.parametros.no3)+p('PO4',f.parametros.po4)+p('Calcio',f.parametros.calcio)+p('Magnesio',f.parametros.magnesio)+p('Otros',f.parametros.otros))}${sec('Cuidados',p('Dificultad',f.cuidados.dificultad)+p('Tamaño adulto',f.cuidados.tamano_adulto)+p('Litros mínimos',f.cuidados.litros_minimos)+p('Zona',f.cuidados.zona)+p('Luz',f.cuidados.luz)+p('Flujo',f.cuidados.flujo)+p('Mantenimiento',f.cuidados.mantenimiento)+p('Aclimatación',f.cuidados.aclimatacion)+p('Cuarentena',f.cuidados.cuarentena))}${sec('Compatibilidad',p('Temperamento',f.compatibilidad.temperamento)+p('Compatible con',f.compatibilidad.compatible_con)+p('Evitar con',f.compatibilidad.evitar_con)+p('Corales',f.compatibilidad.corales)+p('Plantas',f.compatibilidad.plantas)+p('Invertebrados',f.compatibilidad.invertebrados)+p('Notas',f.compatibilidad.notas))}${sec('Alimentación',p('Tipo',f.alimentacion.tipo)+p('Frecuencia',f.alimentacion.frecuencia)+p('Alimentos',f.alimentacion.alimentos)+p('Suplementos',f.alimentacion.suplementos)+p('Notas',f.alimentacion.notas))}${sec('Producto / equipo / test',p('Categoría',f.producto.categoria)+p('Composición',f.producto.composicion)+p('Dosificación',f.producto.dosificacion)+p('Modo de uso',f.producto.modo_uso)+p('Precauciones',f.producto.precauciones)+p('Conservación',f.producto.conservacion)+p('Compatibilidad',f.producto.compatibilidad))}${sec('Riesgos y alertas IA',p('Toxicidad',f.riesgos.toxicidad)+p('Enfermedades',f.riesgos.enfermedades)+p('Plagas',f.riesgos.plagas)+p('Errores frecuentes',f.riesgos.errores_frecuentes)+(f.riesgos.alertas_ia||[]).map(x=>`<div class="alert bad">${esc(x)}</div>`).join(''))}${sec('IA y fuentes',p('Objetivo búsqueda',f.ia.busqueda_objetivo)+p('Resumen IA',f.ia.resumen_para_ia)+p('Fuentes',(f.fuentes||[]).join(' · '))+`<div class="schema">${esc(JSON.stringify(f,null,2))}</div>`)}</article></section>`)}
function editor(f){let chips=(f.tarjeta.chips||[]).join(', '),alerts=(f.riesgos.alertas_ia||[]).join('\n'),keys=(f.ia.keywords||[]).join(', '),fuentes=(f.fuentes||[]).join('\n'),req=(f.ia.fuentes_requeridas||[]).join('\n');return `<section class="grid"><article class="panel"><div class="actions"><button onclick="vista('lista')">← Lista</button><button class="warn" onclick="autoEstructura()">Auto estructura</button><button class="primary" onclick="prepararPrompt()">Prompt IA</button><button onclick="actualizarApp()">↻ Actualizar</button><button class="good" onclick="guardar()">Guardar</button></div><h2>Ficha V4.1 limpia</h2><h3>Tarjeta exterior</h3><label>Título visible</label><input id="card_titulo" value="${esc(f.tarjeta.titulo)}"><label>Subtítulo visible</label><input id="card_subtitulo" value="${esc(f.tarjeta.subtitulo)}"><label>Resumen corto visible</label><textarea id="card_resumen">${esc(f.tarjeta.resumen)}</textarea><label>Aviso rápido visible</label><input id="card_aviso" value="${esc(f.tarjeta.aviso)}"><label>Chips visibles</label><input id="card_chips" value="${esc(chips)}"><h3>Tipo e identificación</h3><div class="row"><div><label>Tipo ficha</label><select id="tipo">${Object.entries(tipos).map(([k,v])=>`<option value="${k}" ${f.tipo===k?'selected':''}>${v[0]} ${v[1]}</option>`).join('')}</select></div><div><label>Estado</label><select id="estado"><option ${f.estado==='borrador'?'selected':''}>borrador</option><option ${f.estado==='revisar'?'selected':''}>revisar</option><option ${f.estado==='lista'?'selected':''}>lista</option></select></div></div><label>Nombre común</label><input id="nombre_comun" value="${esc(f.identificacion.nombre_comun)}"><label>Nombre científico</label><input id="nombre_cientifico" value="${esc(f.identificacion.nombre_cientifico)}"><div class="row"><input id="marca" placeholder="Marca" value="${esc(f.identificacion.marca)}"><input id="modelo" placeholder="Modelo/producto" value="${esc(f.identificacion.modelo)}"></div><div class="row"><input id="fabricante" placeholder="Fabricante" value="${esc(f.identificacion.fabricante)}"><input id="otros_nombres" placeholder="Otros nombres" value="${esc(f.identificacion.otros_nombres)}"></div><h3>Clasificación</h3><div class="row"><input id="grupo" placeholder="Grupo" value="${esc(f.clasificacion.grupo)}"><input id="familia" placeholder="Familia" value="${esc(f.clasificacion.familia)}"></div><div class="row"><select id="ambito"><option ${f.clasificacion.ambito==='marino'?'selected':''}>marino</option><option ${f.clasificacion.ambito==='reef'?'selected':''}>reef</option><option ${f.clasificacion.ambito==='dulce'?'selected':''}>dulce</option><option ${f.clasificacion.ambito==='general'?'selected':''}>general</option></select><input id="reef_safe" placeholder="Reef safe / plantas" value="${esc(f.clasificacion.reef_safe)}"></div><input id="origen" placeholder="Origen" value="${esc(f.clasificacion.origen)}"><h3>Detalle completo</h3><textarea id="descripcion" placeholder="Descripción completa">${esc(f.detalle.descripcion)}</textarea><textarea id="uso_principal" placeholder="Uso principal">${esc(f.detalle.uso_principal)}</textarea><textarea id="observaciones" placeholder="Observaciones">${esc(f.detalle.observaciones)}</textarea><h3>Parámetros</h3><div class="row"><input id="temperatura" placeholder="Temperatura" value="${esc(f.parametros.temperatura)}"><input id="salinidad" placeholder="Salinidad" value="${esc(f.parametros.salinidad)}"></div><div class="row"><input id="ph" placeholder="pH" value="${esc(f.parametros.ph)}"><input id="kh" placeholder="KH" value="${esc(f.parametros.kh)}"></div><div class="row"><input id="gh" placeholder="GH" value="${esc(f.parametros.gh)}"><input id="no3" placeholder="NO3" value="${esc(f.parametros.no3)}"></div><div class="row"><input id="po4" placeholder="PO4" value="${esc(f.parametros.po4)}"><input id="calcio" placeholder="Calcio" value="${esc(f.parametros.calcio)}"></div><div class="row"><input id="magnesio" placeholder="Magnesio" value="${esc(f.parametros.magnesio)}"><input id="param_otros" placeholder="Otros" value="${esc(f.parametros.otros)}"></div><h3>Cuidados</h3><div class="row"><input id="dificultad" placeholder="Dificultad" value="${esc(f.cuidados.dificultad)}"><input id="tamano_adulto" placeholder="Tamaño adulto" value="${esc(f.cuidados.tamano_adulto)}"></div><div class="row"><input id="litros_minimos" placeholder="Litros mínimos" value="${esc(f.cuidados.litros_minimos)}"><input id="zona" placeholder="Zona" value="${esc(f.cuidados.zona)}"></div><div class="row"><input id="luz" placeholder="Luz" value="${esc(f.cuidados.luz)}"><input id="flujo" placeholder="Flujo" value="${esc(f.cuidados.flujo)}"></div><textarea id="mantenimiento" placeholder="Mantenimiento">${esc(f.cuidados.mantenimiento)}</textarea><textarea id="aclimatacion" placeholder="Aclimatación">${esc(f.cuidados.aclimatacion)}</textarea><textarea id="cuarentena" placeholder="Cuarentena">${esc(f.cuidados.cuarentena)}</textarea><h3>Compatibilidad</h3><input id="temperamento" placeholder="Temperamento" value="${esc(f.compatibilidad.temperamento)}"><textarea id="compatible_con" placeholder="Compatible con">${esc(f.compatibilidad.compatible_con)}</textarea><textarea id="evitar_con" placeholder="Evitar con">${esc(f.compatibilidad.evitar_con)}</textarea><textarea id="corales" placeholder="Corales">${esc(f.compatibilidad.corales)}</textarea><textarea id="plantas" placeholder="Plantas">${esc(f.compatibilidad.plantas)}</textarea><textarea id="invertebrados" placeholder="Invertebrados">${esc(f.compatibilidad.invertebrados)}</textarea><textarea id="compat_notas" placeholder="Notas compatibilidad">${esc(f.compatibilidad.notas)}</textarea><h3>Alimentación</h3><input id="alim_tipo" placeholder="Tipo" value="${esc(f.alimentacion.tipo)}"><input id="frecuencia" placeholder="Frecuencia" value="${esc(f.alimentacion.frecuencia)}"><textarea id="alimentos" placeholder="Alimentos">${esc(f.alimentacion.alimentos)}</textarea><textarea id="suplementos" placeholder="Suplementos">${esc(f.alimentacion.suplementos)}</textarea><textarea id="alim_notas" placeholder="Notas alimentación">${esc(f.alimentacion.notas)}</textarea><h3>Producto / equipo</h3><input id="prod_categoria" placeholder="Categoría" value="${esc(f.producto.categoria)}"><textarea id="composicion" placeholder="Composición / ingredientes">${esc(f.producto.composicion)}</textarea><textarea id="dosificacion" placeholder="Dosificación">${esc(f.producto.dosificacion)}</textarea><textarea id="modo_uso" placeholder="Modo de uso">${esc(f.producto.modo_uso)}</textarea><textarea id="precauciones" placeholder="Precauciones">${esc(f.producto.precauciones)}</textarea><input id="conservacion" placeholder="Conservación" value="${esc(f.producto.conservacion)}"><textarea id="prod_compat" placeholder="Compatibilidad producto">${esc(f.producto.compatibilidad)}</textarea><h3>Riesgos y alertas</h3><textarea id="toxicidad" placeholder="Toxicidad">${esc(f.riesgos.toxicidad)}</textarea><textarea id="enfermedades" placeholder="Enfermedades">${esc(f.riesgos.enfermedades)}</textarea><textarea id="plagas" placeholder="Plagas">${esc(f.riesgos.plagas)}</textarea><textarea id="errores" placeholder="Errores frecuentes">${esc(f.riesgos.errores_frecuentes)}</textarea><textarea id="alertas_ia" placeholder="Alertas IA, una por línea">${esc(alerts)}</textarea><h3>Asistente IA</h3><textarea id="busqueda_objetivo" placeholder="Qué debe buscar la IA: ficha fabricante, especie, parámetros, fotos...">${esc(f.ia.busqueda_objetivo)}</textarea><textarea id="fuentes_requeridas" placeholder="Fuentes requeridas, una por línea">${esc(req)}</textarea><textarea id="resumen_ia" placeholder="Resumen para IA">${esc(f.ia.resumen_para_ia)}</textarea><input id="keywords" placeholder="Keywords" value="${esc(keys)}"><div class="row"><input id="destino" placeholder="Destino" value="${esc(f.ia.destino)}"><input id="prioridad" placeholder="Prioridad" value="${esc(f.ia.prioridad)}"></div><div class="row"><select id="crear_animal"><option value="si" ${f.ia.puede_crear_animal?'selected':''}>Puede crear animal: sí</option><option value="no" ${!f.ia.puede_crear_animal?'selected':''}>Puede crear animal: no</option></select><select id="crear_producto"><option value="no" ${!f.ia.puede_crear_producto?'selected':''}>Puede crear producto: no</option><option value="si" ${f.ia.puede_crear_producto?'selected':''}>Puede crear producto: sí</option></select></div><h3>Foto y portada</h3><select id="verificado"><option value="no" ${!f.verificado?'selected':''}>No verificado</option><option value="si" ${f.verificado?'selected':''}>Verificado</option></select><textarea id="fuentes" placeholder="Fuentes finales, una por línea">${esc(fuentes)}</textarea><label>Foto original / portada</label><input type="file" accept="image/*" onchange="foto(event)"><input id="fotoData" type="hidden" value="${esc(f.media.foto_original)}"><input id="portadaData" type="hidden" value="${esc(f.tarjeta.portada)}"><div id="fotoBox">${f.tarjeta.portada?`<img class="photoPreview" src="${f.tarjeta.portada}">`:''}</div><div class="actions" style="margin-top:16px"><button class="good" onclick="guardar()">Guardar ficha V4</button></div></article></section>`}
function foto(ev){let file=ev.target.files?.[0];if(!file)return;let r=new FileReader();r.onload=()=>{document.getElementById('fotoData').value=r.result;document.getElementById('portadaData').value=r.result;document.getElementById('fotoBox').innerHTML=`<img class="photoPreview" src="${r.result}">`};r.readAsDataURL(file)}
function autoEstructura(){let f=getForm(),name=titulo(f);if(name==='Ficha sin nombre'){alert('Pon primero nombre, marca o modelo.');return}document.getElementById('card_titulo').value=f.tarjeta.titulo||name;document.getElementById('card_subtitulo').value=f.tarjeta.subtitulo||subtitulo(f);document.getElementById('card_resumen').value=f.tarjeta.resumen||`${name}: ${tipos[f.tipo]?.[1].toLowerCase()} pendiente de completar y verificar.`;document.getElementById('card_aviso').value=f.tarjeta.aviso||'Revisar compatibilidad, dosis/parámetros y fuentes antes de usar.';document.getElementById('card_chips').value=f.tarjeta.chips?.length?f.tarjeta.chips.join(', '):`${tipos[f.tipo]?.[1]}, ${f.clasificacion.ambito}, ${f.cuidados.dificultad}`;document.getElementById('busqueda_objetivo').value=f.ia.busqueda_objetivo||objetivoIA(f);document.getElementById('resumen_ia').value=f.ia.resumen_para_ia||`AcuarioNexo debe leer esta ficha como ${tipos[f.tipo]?.[1]}. Separar tarjeta visible, detalle completo, riesgos y fuentes.`}
function objetivoIA(f){if(['producto','sal','test','medicamento','alimento','equipo'].includes(f.tipo))return `Buscar ficha oficial del fabricante para ${titulo(f)}. Extraer composición, modo de uso, dosis, precauciones, compatibilidad, conservación, imagen/portada y fuentes.`;return `Buscar información fiable de ${titulo(f)}. Extraer parámetros, compatibilidad, alimentación, cuidados, riesgos, comportamiento, imagen/portada y fuentes.`}
function prompt(f){return `Completa esta ficha para AcuarioNexo. Devuelve SOLO JSON válido con el mismo esquema acuarionexo.ficha.v4.\n\nDebe tener tarjeta exterior corta y ficha interior completa.\nDebe respetar la plantilla: ${f.plantilla}.\nSi es producto/equipo/test/sal/medicamento, busca ficha del fabricante y rellena producto.\nSi es animal/planta/coral/microfauna, busca información fiable y rellena parámetros, cuidados, compatibilidad, alimentación y riesgos.\nSi no puedes verificar un dato, escribe "pendiente de verificar".\nIncluye fuentes.\n\nFICHA BASE:\n${JSON.stringify(f,null,2)}`}
function prepararPrompt(){let f=getForm();navigator.clipboard?.writeText(prompt(f));alert('Prompt IA copiado. Pégalo en Gemini/ChatGPT y después pega la respuesta JSON en IA.')}
function copiarPrompt(i){let f=fichas.find(x=>x.id===i);navigator.clipboard?.writeText(prompt(f));alert('Prompt copiado.')}
function vistaIA(){modo='ia';render(`<section class="grid"><article class="panel"><h2>Asistente IA</h2><p class="notice">Flujo limpio: crear ficha base → copiar prompt → IA busca/rellena → pegar JSON → guardar. La app sigue sin Supabase.</p><div class="actions"><button class="primary" onclick="navigator.clipboard.writeText(prompt(actual||base()))">Copiar prompt base</button><button onclick="navigator.clipboard.readText().then(t=>document.getElementById('iaJson').value=t)">Pegar portapapeles</button><button onclick="actualizarApp()">↻ Actualizar app</button></div><label>Respuesta JSON de la IA</label><textarea id="iaJson" style="min-height:280px" placeholder="Pega aquí el JSON devuelto por la IA"></textarea><button class="good" onclick="try{let f=normaliza(JSON.parse(val('iaJson')));let i=fichas.findIndex(x=>x.id===f.id);if(i>=0)fichas[i]=f;else fichas.unshift(f);save();detalle(f.id)}catch(e){alert('JSON no válido: '+e.message)}">Importar respuesta IA</button></article><article class="panel"><h2>Plantillas de portada</h2><p class="small">La ficha guarda el campo <b>plantilla</b>. AcuarioNexo podrá usarlo luego para colocar la foto sobre el marco correcto.</p>${Object.entries(tipos).map(([k,v])=>`<div class="section"><h3>${v[0]} ${v[1]}</h3><p>${v[2]}</p></div>`).join('')}</article></section>`)}
function exportObj(){return{app:'AcuarioNexo Creador de Fichas',schema:'acuarionexo.fichas.export.v4',version:4,exported_at:new Date().toISOString(),fichas}}
function descargar(){let blob=new Blob([JSON.stringify(exportObj(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='acuarionexo_fichas_v4_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function copiarExport(){navigator.clipboard?.writeText(JSON.stringify(exportObj(),null,2));alert('JSON copiado.')}
function importar(){try{let data=JSON.parse(val('importTxt')),list=Array.isArray(data)?data:(data.fichas||[data]);let map=new Map(fichas.map(f=>[f.id,f]));list.forEach(x=>{let f=normaliza(x);map.set(f.id,f)});fichas=Array.from(map.values());save();vista('lista')}catch(e){alert('No pude importar: '+e.message)}}
function borrarTodo(){if(confirm('¿Borrar todas las fichas locales?')){fichas=[];save();vista('lista')}}
function vistaJSON(){modo='json';render(`<section class="grid"><article class="panel"><h2>JSON</h2><div class="actions"><button onclick="descargar()">Descargar</button><button onclick="copiarExport()">Copiar</button><button onclick="actualizarApp()">↻ Actualizar app</button><button class="danger" onclick="borrarTodo()">Borrar locales</button></div><label>Importar JSON</label><textarea id="importTxt" style="min-height:240px"></textarea><button class="primary" onclick="importar()">Importar</button></article></section>`)}
function vista(v){if(v==='lista')return vistaLista();if(v==='ia')return vistaIA();if(v==='json')return vistaJSON();vistaLista()}
load();vista('lista');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
