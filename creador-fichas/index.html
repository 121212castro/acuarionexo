<style>
:root{--bg:#06111c;--panel:#0d2032;--txt:#eff9ff;--muted:#a8bfd0;--line:rgba(255,255,255,.13);--blue:#4bd7ff;--green:#56e39f;--yellow:#ffd166;--red:#ff7474;--shadow:0 18px 55px rgba(0,0,0,.34)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,rgba(75,215,255,.16),transparent 32%),radial-gradient(circle at bottom left,rgba(86,227,159,.12),transparent 30%),var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top) 0 104px}button,input,select,textarea{font:inherit}button{border:0;border-radius:16px;padding:13px 14px;background:#183752;color:var(--txt);font-weight:800;box-shadow:inset 0 0 0 1px var(--line)}button.primary{background:linear-gradient(135deg,#1f93ff,#48d6ff);color:#03111c}button.good{background:linear-gradient(135deg,#22c878,#67eeb2);color:#03140c}button.warn{background:linear-gradient(135deg,#ffb84d,#ffd166);color:#281700}button.danger{background:#4d1921;color:#ffe0e0}.wrap{max-width:1080px;margin:auto;padding:12px}.hero{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(16,42,66,.96),rgba(6,17,28,.96));box-shadow:var(--shadow);position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:4;backdrop-filter:blur(14px)}.logo{width:56px;height:56px;border-radius:18px;background:#fff}.heroText{flex:1}.hero h1{margin:0;font-size:22px}.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}.refreshBtn{white-space:nowrap;padding:11px 12px;font-size:13px}.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(4,14,22,.92);border-top:1px solid var(--line);backdrop-filter:blur(16px);z-index:5}.tabs button{font-size:12px;padding:10px 5px}.tabs button.active{background:linear-gradient(135deg,#1f93ff,#48d6ff);color:#03111c}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:14px}.panel{grid-column:span 12;background:rgba(13,32,50,.91);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow)}h2,h3{margin:0 0 12px}.small{font-size:13px;color:var(--muted)}label{display:block;margin:12px 0 6px;font-weight:800;color:#cbe4f7;font-size:13px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:15px;background:#061624;color:var(--txt);padding:13px 14px;outline:none}textarea{min-height:96px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;flex-wrap:wrap}.library{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:linear-gradient(145deg,rgba(16,42,66,.92),rgba(7,18,30,.92));box-shadow:var(--shadow)}.cover{height:172px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#061624;font-size:48px;position:relative}.cover img{width:100%;height:100%;object-fit:cover}.coverIcon{position:relative;z-index:2;text-shadow:0 8px 28px rgba(0,0,0,.55)}.cardBody{padding:14px}.cardBody h3{font-size:18px;margin:0 0 4px}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:6px 10px;margin:4px 4px 0 0;color:#d8eefb;background:rgba(255,255,255,.06);font-size:12px}.notice,.alert{border-left:4px solid var(--yellow);background:rgba(255,209,102,.1);padding:10px 12px;border-radius:14px;margin:10px 0;color:#ffe4a7}.notice{border-left-color:var(--blue);background:rgba(75,215,255,.1);color:#dcf8ff}.bad{border-left-color:var(--red);background:rgba(255,116,116,.1);color:#ffdada}.detailHero{display:grid;grid-template-columns:190px 1fr;gap:15px;align-items:center}.detailPhoto{width:190px;height:190px;border-radius:24px;border:1px solid var(--line);object-fit:cover;background:#061624}.detailFondo{width:190px;height:190px;border-radius:24px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:64px}.section{border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;background:rgba(255,255,255,.04)}.schema{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre-wrap;background:#04101b;border:1px solid var(--line);border-radius:16px;padding:12px;max-height:380px;overflow:auto}.empty{padding:22px;border:1px dashed rgba(255,255,255,.22);border-radius:18px;color:var(--muted);text-align:center}.photoPreview,.fondoPreview{width:100%;max-height:360px;min-height:190px;object-fit:cover;border-radius:18px;border:1px solid var(--line);margin-top:10px;background:#04101b;display:flex;align-items:center;justify-content:center;font-size:58px}.drop{border:1px dashed rgba(75,215,255,.42);border-radius:22px;padding:16px;background:rgba(75,215,255,.07)}.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#061624;border:1px solid var(--line);border-radius:10px;padding:2px 6px;color:#dcf8ff}@media(max-width:760px){.wrap{padding:10px}.hero{border-radius:22px}.logo{width:50px;height:50px}.hero h1{font-size:19px}.hero p{font-size:12px}.refreshBtn{padding:9px 10px;font-size:12px}.row,.detailHero{grid-template-columns:1fr}.detailPhoto,.detailFondo{width:100%;height:230px}.actions button{flex:1 1 auto}.panel{padding:14px}.tabs button{font-size:11px}}
</style>

<body>
<main class="wrap"><header class="hero"><img class="logo" src="logo.svg" alt="Logo"><div class="heroText"><h1>Creador de Fichas V4.3</h1><p>Fichas V4 + foto + fondos integrados</p></div><button class="refreshBtn" onclick="actualizarApp()">↻ Actualizar</button></header><div id="app"></div></main>
<nav class="tabs"><button id="tab-lista" onclick="vista('lista')">📚 Fichas</button><button id="tab-foto" onclick="vista('foto')">📷 Foto</button><button id="tab-nueva" onclick="nueva()">✍️ Crear</button><button id="tab-ia" onclick="vista('ia')">🤖 IA</button><button id="tab-json" onclick="vista('json')">⇄ JSON</button></nav>
<script>
const KEY='acuarionexo_creador_fichas_v4',OLD=['acuarionexo_creador_fichas_v3','acuarionexo_creador_fichas_v2','acuarionexo_creador_fichas_v1'];
const app=document.getElementById('app');let fichas=[],actual=null,modo='lista',fotoTemporal='';
const tipos={animal_pez_marino:['🐠','Pez marino','plantilla_peces_marino'],animal_pez_dulce:['🐟','Pez dulce','plantilla_peces_dulce'],animal_coral:['🪸','Coral','plantilla_corales'],animal_invertebrado:['🦐','Invertebrado','plantilla_invertebrados'],planta:['🌿','Planta','plantilla_plantas'],microfauna:['🧫','Microfauna','plantilla_microfauna'],producto:['🧴','Producto','plantilla_productos'],sal:['🧂','Sal','plantilla_productos'],test:['🧪','Test','plantilla_productos'],medicamento:['💊','Medicamento','plantilla_productos'],alimento:['🍽️','Alimento','plantilla_productos'],equipo:['⚙️','Equipo','plantilla_equipos'],guia:['📘','Guía','plantilla_guias'],otro:['📄','Otro','plantilla_general']};
const fondos={reef:{nombre:'Reef azul',icono:'🪸',css:'radial-gradient(circle at 18% 18%,rgba(108,231,255,.48),transparent 22%),radial-gradient(circle at 82% 28%,rgba(255,120,190,.30),transparent 20%),linear-gradient(135deg,#06314a,#071522 58%,#030812)'},marino:{nombre:'Marino profundo',icono:'🐠',css:'radial-gradient(circle at 72% 22%,rgba(75,215,255,.42),transparent 20%),radial-gradient(circle at 28% 80%,rgba(40,120,220,.40),transparent 24%),linear-gradient(135deg,#041629,#063a56)'},dulce:{nombre:'Dulce plantado',icono:'🌿',css:'radial-gradient(circle at 25% 22%,rgba(86,227,159,.40),transparent 24%),radial-gradient(circle at 82% 76%,rgba(150,255,180,.22),transparent 25%),linear-gradient(135deg,#052315,#0b3d31)'},coral:{nombre:'Coral premium',icono:'🪸',css:'radial-gradient(circle at 30% 25%,rgba(255,122,180,.45),transparent 22%),radial-gradient(circle at 78% 70%,rgba(255,209,102,.28),transparent 24%),linear-gradient(135deg,#311336,#09243a)'},producto:{nombre:'Producto técnico',icono:'🧴',css:'radial-gradient(circle at 25% 25%,rgba(255,255,255,.26),transparent 18%),radial-gradient(circle at 78% 38%,rgba(75,215,255,.30),transparent 24%),linear-gradient(135deg,#182437,#071522)'},equipo:{nombre:'Equipo oscuro',icono:'⚙️',css:'radial-gradient(circle at 25% 30%,rgba(160,180,200,.30),transparent 22%),radial-gradient(circle at 80% 70%,rgba(75,215,255,.20),transparent 23%),linear-gradient(135deg,#15191f,#06111c)'},micro:{nombre:'Microfauna',icono:'🧫',css:'radial-gradient(circle at 35% 30%,rgba(170,255,210,.35),transparent 18%),radial-gradient(circle at 72% 66%,rgba(75,215,255,.28),transparent 19%),linear-gradient(135deg,#05211e,#0a1830)'},neutro:{nombre:'Neutro AcuarioNexo',icono:'📄',css:'radial-gradient(circle at 18% 18%,rgba(75,215,255,.22),transparent 26%),radial-gradient(circle at 82% 82%,rgba(86,227,159,.18),transparent 28%),linear-gradient(135deg,#071522,#0d2032)'}};
async function actualizarApp(){try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches'in window){await Promise.all((await caches.keys()).map(k=>caches.delete(k)))}}catch(e){}location.href=location.pathname+'?v='+Date.now()}
function id(){return 'ficha_'+Date.now()+'_'+Math.random().toString(16).slice(2)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function val(k){return (document.getElementById(k)?.value||'').trim()}function lines(t){return String(t||'').split('\n').map(x=>x.trim()).filter(Boolean)}function csv(t){return String(t||'').split(',').map(x=>x.trim()).filter(Boolean)}function save(){localStorage.setItem(KEY,JSON.stringify(fichas))}
function render(h){app.innerHTML=h;scrollTo(0,0);document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+modo)?.classList.add('active')}
function fondoAuto(tipo){if(tipo==='animal_coral')return 'coral';if(tipo==='animal_pez_dulce'||tipo==='planta')return 'dulce';if(tipo==='microfauna')return 'micro';if(['producto','sal','test','medicamento','alimento'].includes(tipo))return 'producto';if(tipo==='equipo')return 'equipo';if(tipo==='animal_pez_marino'||tipo==='animal_invertebrado')return 'marino';return 'neutro'}
function fondoCss(f){return fondos[f?.tarjeta?.fondo||fondoAuto(f?.tipo)]?.css||fondos.neutro.css}
function fondoIcon(f){return fondos[f?.tarjeta?.fondo||fondoAuto(f?.tipo)]?.icono||icon(f)}
function base(){const now=new Date().toISOString();return{schema:'acuarionexo.ficha.v4',id:id(),tipo:'animal_pez_marino',estado:'borrador',verificado:false,plantilla:'plantilla_peces_marino',tarjeta:{titulo:'',subtitulo:'',resumen:'',aviso:'',chips:[],portada:'',fondo:'marino'},identificacion:{nombre_comun:'',nombre_cientifico:'',marca:'',modelo:'',fabricante:'',otros_nombres:''},clasificacion:{ambito:'marino',grupo:'',familia:'',origen:'',reef_safe:'pendiente'},detalle:{descripcion:'',uso_principal:'',observaciones:''},parametros:{temperatura:'',salinidad:'',ph:'',kh:'',gh:'',no3:'',po4:'',calcio:'',magnesio:'',otros:''},cuidados:{dificultad:'Media',tamano_adulto:'',litros_minimos:'',zona:'',luz:'',flujo:'',mantenimiento:'',aclimatacion:'',cuarentena:''},compatibilidad:{temperamento:'',compatible_con:'',evitar_con:'',corales:'',plantas:'',invertebrados:'',notas:''},alimentacion:{tipo:'',frecuencia:'',alimentos:'',suplementos:'',notas:''},producto:{categoria:'',composicion:'',dosificacion:'',modo_uso:'',precauciones:'',conservacion:'',compatibilidad:''},riesgos:{toxicidad:'',enfermedades:'',plagas:'',errores_frecuentes:'',alertas_ia:[]},ia:{resumen_para_ia:'',keywords:[],destino:'biblioteca',prioridad:'normal',busqueda_objetivo:'',fuentes_requeridas:[],puede_crear_animal:true,puede_crear_producto:false,origen_foto:false,tipo_sugerido:'',instrucciones_foto:''},fuentes:[],media:{foto_original:'',foto_recortada:'',portada_generada:''},created_at:now,updated_at:now}}
function titulo(f){return f.tarjeta.titulo||f.identificacion.nombre_comun||f.identificacion.nombre_cientifico||f.identificacion.marca||f.identificacion.modelo||'Ficha sin nombre'}function subtitulo(f){return f.tarjeta.subtitulo||f.identificacion.nombre_cientifico||[f.identificacion.marca,f.identificacion.modelo].filter(Boolean).join(' ')||tipos[f.tipo]?.[1]||''}
function completa(f){f.schema='acuarionexo.ficha.v4';f.tarjeta=f.tarjeta||{};f.tarjeta.fondo=f.tarjeta.fondo||fondoAuto(f.tipo);f.plantilla=tipos[f.tipo]?.[2]||f.plantilla||'plantilla_general';f.tarjeta.titulo=f.tarjeta.titulo||titulo(f);f.tarjeta.subtitulo=f.tarjeta.subtitulo||subtitulo(f);f.tarjeta.resumen=f.tarjeta.resumen||f.detalle.uso_principal||String(f.detalle.descripcion||'').slice(0,155);f.tarjeta.aviso=f.tarjeta.aviso||f.riesgos.alertas_ia?.[0]||f.producto.precauciones||'';f.tarjeta.chips=f.tarjeta.chips?.length?f.tarjeta.chips:[tipos[f.tipo]?.[1],f.clasificacion.ambito,f.cuidados.dificultad,f.clasificacion.reef_safe].filter(Boolean);f.tarjeta.portada=f.media.portada_generada||f.media.foto_recortada||f.media.foto_original||f.tarjeta.portada||'';return f}
function normaliza(x){let b=base();if(x&&typeof x==='object'){Object.assign(b,x);['tarjeta','identificacion','clasificacion','detalle','parametros','cuidados','compatibilidad','alimentacion','producto','riesgos','ia','media'].forEach(k=>b[k]={...base()[k],...(x[k]||{})});b.id=x.id||b.id;b.tipo=x.tipo||x.tipo_ficha||b.tipo;b.fuentes=Array.isArray(x.fuentes)?x.fuentes:[]}return completa(b)}
function load(){try{fichas=JSON.parse(localStorage.getItem(KEY)||'[]').map(normaliza)}catch(e){fichas=[]}if(!fichas.length){for(const k of OLD){try{const o=JSON.parse(localStorage.getItem(k)||'[]');if(o.length){fichas=o.map(normaliza);save();break}}catch(e){}}}}
function icon(f){return tipos[f.tipo]?.[0]||'📄'}
function coverHtml(f,cls='cover'){return f.tarjeta.portada?`<div class="${cls}"><img src="${f.tarjeta.portada}" alt=""></div>`:`<div class="${cls}" style="background:${fondoCss(f)}"><span class="coverIcon">${fondoIcon(f)}</span></div>`}
function card(f){return `<article class="card" onclick="detalle('${f.id}')">${coverHtml(f)}<div class="cardBody"><h3>${esc(titulo(f))}</h3><p class="small">${esc(subtitulo(f))}</p><p>${esc(f.tarjeta.resumen||'Sin resumen corto.')}</p><div>${(f.tarjeta.chips||[]).slice(0,4).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>${f.ia?.origen_foto?'<span class="pill">📷 creada desde foto</span>':''}<span class="pill">🎨 ${esc(fondos[f.tarjeta.fondo]?.nombre||'Fondo')}</span><div class="actions" style="margin-top:10px"><button class="primary" onclick="event.stopPropagation();detalle('${f.id}')">Ver</button><button onclick="event.stopPropagation();editar('${f.id}')">Editar</button></div></div></article>`}
function vistaLista(){modo='lista';let q=(document.getElementById('buscar')?.value||'').toLowerCase();let a=fichas.filter(f=>!q||JSON.stringify(f).toLowerCase().includes(q));render(`<section class="grid"><article class="panel"><div class="actions"><button class="primary" onclick="nueva()">+ Nueva ficha</button><button class="good" onclick="vista('foto')">📷 Crear desde foto</button><button onclick="descargar()">Descargar JSON</button><button onclick="copiarExport()">Copiar JSON</button><button onclick="actualizarApp()">↻ Actualizar</button></div><label>Buscar</label><input id="buscar" value="${esc(q)}" placeholder="pez, coral, producto, marca, uso..." oninput="vistaLista()"><p class="small">V4.3 conserva <span class="kbd">acuarionexo.ficha.v4</span> y añade fondos integrados por categoría.</p></article><article class="panel"><div class="library">${a.length?a.map(card).join(''):'<div class="empty">Sin fichas todavía.</div>'}</div></article></section>`)}
function vistaFoto(){modo='foto';render(`<section class="grid"><article class="panel"><h2>📷 Crear ficha desde foto</h2><p class="small">Sube o haz una foto. La app prepara una ficha base, sugiere tipo, aplica fondo/portada y genera prompt IA.</p><div class="drop"><label>Foto</label><input id="fotoInput" type="file" accept="image/*" capture="environment" onchange="leerFoto(event)"><div id="fotoBox">${fotoTemporal?`<img class="photoPreview" src="${fotoTemporal}" alt="foto">`:'<div class="empty">Aún no hay foto cargada.</div>'}</div></div><div class="row"><div><label>Tipo sugerido</label><select id="fotoTipo" onchange="actualizarVistaFondoFoto()">${Object.entries(tipos).map(([k,v])=>`<option value="${k}">${v[0]} ${v[1]}</option>`).join('')}</select></div><div><label>Pista opcional</label><input id="fotoPista" placeholder="Ej.: caja de sal, coral blando, pez payaso..."></div></div><label>Notas visibles de la foto</label><textarea id="fotoNotas" placeholder="Color, forma, texto de etiqueta, marca visible, comportamiento, lugar donde se vio..."></textarea><label>Fondo si la ficha queda sin foto</label><select id="fotoFondo">${Object.entries(fondos).map(([k,v])=>`<option value="${k}">${v.icono} ${v.nombre}</option>`).join('')}</select><div id="fotoFondoPreview" class="fondoPreview" style="background:${fondos.marino.css}">🐠</div><div class="actions"><button class="warn" onclick="sugerirTipoFoto()">Detectar tipo sugerido</button><button class="primary" onclick="crearFichaDesdeFoto()">Crear ficha base</button><button class="good" onclick="promptDesdeFoto()">Generar prompt IA</button></div><div class="notice"><b>Flujo:</b> foto → tipo sugerido → fondo/portada → ficha base → prompt IA → importar JSON → guardar.</div></article></section>`);if(fotoTemporal)setTimeout(sugerirTipoFoto,30)}
function actualizarVistaFondoFoto(){let k=fondoAuto(val('fotoTipo')),sel=document.getElementById('fotoFondo');if(sel)sel.value=k;let p=document.getElementById('fotoFondoPreview'),f=fondos[sel?.value||k];if(p&&f){p.style.background=f.css;p.textContent=f.icono}}
function leerFoto(ev){const file=ev.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{fotoTemporal=reader.result;vistaFoto()};reader.readAsDataURL(file)}
function sugerirTipoFoto(){const texto=(val('fotoPista')+' '+val('fotoNotas')).toLowerCase();let tipo='otro';if(/coral|zoa|euphy|kenia|sarco|gsp|monti|lps|sps|pólipo|polipo/.test(texto))tipo='animal_coral';else if(/sal|salt|reef crystals|pro reef|marine salt/.test(texto))tipo='sal';else if(/test|hanna|jbl|salifert|checker|reactivo|nitrato|fosfato|kh|calcio|magnesio/.test(texto))tipo='test';else if(/bomba|skimmer|luz|filtro|calentador|dosificadora|uv|equipo/.test(texto))tipo='equipo';else if(/comida|alimento|granulo|escama|artemia|mysis/.test(texto))tipo='alimento';else if(/medic|tratamiento|cura|bacteria|punto blanco/.test(texto))tipo='medicamento';else if(/planta|anubia|buce|rotala|vallisneria|musgo/.test(texto))tipo='planta';else if(/gamba|caracol|cangrejo|erizo|estrella|camarón|camaron|shrimp|snail/.test(texto))tipo='animal_invertebrado';else if(/betta|neón|neon|guppy|disco|escalar|cory|ancistrus|dulce/.test(texto))tipo='animal_pez_dulce';else if(/pez|payaso|ocellaris|gramma|gobio|cirujano|blenio|marino/.test(texto))tipo='animal_pez_marino';document.getElementById('fotoTipo').value=tipo;actualizarVistaFondoFoto();return tipo}
function plantillaPorFoto(tipo){let f=base();f.tipo=tipo||'otro';f.tarjeta.fondo=val('fotoFondo')||fondoAuto(f.tipo);f.plantilla=tipos[f.tipo]?.[2]||'plantilla_general';f.media.foto_original=fotoTemporal||'';f.media.portada_generada=fotoTemporal||'';f.tarjeta.portada=fotoTemporal||'';f.ia.origen_foto=true;f.ia.tipo_sugerido=f.tipo;f.ia.instrucciones_foto=val('fotoNotas');f.ia.busqueda_objetivo='Identificar lo que aparece en la foto, buscar información oficial/fabricante si aplica y devolver JSON acuarionexo.ficha.v4 completo.';f.ia.fuentes_requeridas=['Fuente oficial o fabricante si es producto/equipo/test/sal','Fuente técnica fiable si es animal/planta/coral','No inventar datos: marcar pendiente cuando no se vea claro'];f.tarjeta.titulo='Ficha desde foto';f.tarjeta.subtitulo=tipos[f.tipo]?.[1]||'Pendiente';f.tarjeta.resumen='Ficha base creada desde foto. Pendiente de análisis IA y revisión.';f.tarjeta.aviso='Revisar identificación antes de dar por válida.';f.tarjeta.chips=['📷 Foto',tipos[f.tipo]?.[1]||'Tipo pendiente','IA pendiente'];if(['producto','sal','test','medicamento','alimento','equipo'].includes(f.tipo)){f.clasificacion.ambito='general';f.ia.puede_crear_animal=false;f.ia.puede_crear_producto=true;f.producto.categoria=tipos[f.tipo]?.[1]||''}else{f.ia.puede_crear_animal=true;f.ia.puede_crear_producto=false;f.clasificacion.ambito=f.tipo.includes('dulce')||f.tipo==='planta'?'dulce':'marino'}return completa(f)}
function crearFichaDesdeFoto(){if(!fotoTemporal){alert('Primero carga o haz una foto.');return}actual=plantillaPorFoto(sugerirTipoFoto());modo='nueva';render(editor(actual))}
function promptFotoTexto(f){const copia=JSON.parse(JSON.stringify(f));copia.media={foto_original:'[FOTO ADJUNTA EN EL CHAT]',foto_recortada:'',portada_generada:'[usar la foto como portada si es válida]'};return `Analiza la FOTO adjunta y crea una ficha para AcuarioNexo.\n\nObjetivo:\n1. Identifica lo que aparece en la imagen.\n2. Si es producto, equipo, test, sal, medicamento o alimento, busca fabricante, modelo, composición, uso, dosis, precauciones y compatibilidad.\n3. Si es pez, coral, invertebrado, planta o microfauna, busca identificación, cuidados, parámetros, compatibilidad, riesgos y alimentación.\n4. No inventes datos. Si algo no se puede confirmar, escribe "pendiente".\n5. Devuelve SOLO un JSON válido con schema "acuarionexo.ficha.v4".\n6. Mantén todos los bloques del esquema.\n7. Conserva tarjeta.fondo si no hay foto clara; usa la foto como portada si es válida.\n\nContexto visible:\n- Tipo sugerido: ${tipos[f.tipo]?.[1]||f.tipo}\n- Fondo asignado: ${fondos[f.tarjeta.fondo]?.nombre||f.tarjeta.fondo}\n- Pista: ${val('fotoPista')||'sin pista'}\n- Notas de foto: ${val('fotoNotas')||'sin notas'}\n\nJSON base que debes completar:\n${JSON.stringify(copia,null,2)}`}
async function promptDesdeFoto(){if(!fotoTemporal){alert('Primero carga o haz una foto.');return}const f=plantillaPorFoto(sugerirTipoFoto()),txt=promptFotoTexto(f);await navigator.clipboard?.writeText(txt).catch(()=>{});modo='ia';render(`<section class="grid"><article class="panel"><h2>Prompt IA desde foto</h2><p class="notice">Prompt copiado si el navegador lo permite. Pega este texto en la IA junto con la foto. Después importa el JSON en la pestaña JSON.</p><textarea style="min-height:520px">${esc(txt)}</textarea><div class="actions"><button onclick="vista('foto')">← Volver a foto</button><button class="primary" onclick="crearFichaDesdeFoto()">Crear ficha base editable</button></div></article></section>`)}

function guardar(){let f=getForm();if(titulo(f)==='Ficha sin nombre'){alert('Pon título, nombre, marca o modelo.');return}let i=fichas.findIndex(x=>x.id===f.id);if(i>=0)fichas[i]=f;else fichas.unshift(f);save();actual=f;detalle(f.id)}

function promptGeneral(f){return `Completa esta ficha para AcuarioNexo. Devuelve SOLO JSON válido, sin markdown. Mantén schema "acuarionexo.ficha.v4" y todos los bloques. Respeta tarjeta.fondo como fondo visual si no hay foto. No inventes: usa "pendiente" si no hay datos fiables. Busca fuentes oficiales/fabricante cuando corresponda.\n\nJSON base:\n${JSON.stringify(f,null,2)}`}
function copiarPrompt(i){const f=fichas.find(x=>x.id===i);if(!f)return;copiarTexto(promptGeneral(f));alert('Prompt IA copiado.')}function copiarTexto(t){navigator.clipboard?.writeText(t).catch(()=>{})}
function vistaIA(){modo='ia';render(`<section class="grid"><article class="panel"><h2>🤖 Asistente IA</h2><p class="small">Usa una ficha existente, una ficha desde foto o pega un JSON base. La IA debe devolver siempre <span class="kbd">acuarionexo.ficha.v4</span>.</p><div class="actions"><button class="primary" onclick="nueva()">Crear base manual</button><button class="good" onclick="vista('foto')">Crear desde foto</button><button onclick="vista('json')">Importar JSON</button></div><div class="notice">Para foto: abre 📷 Foto, carga imagen, genera prompt y pega el resultado en JSON.</div></article></section>`)}
function vistaJSON(){modo='json';render(`<section class="grid"><article class="panel"><h2>⇄ JSON</h2><div class="actions"><button onclick="descargar()">Descargar todo</button><button onclick="copiarExport()">Copiar todo</button><button class="primary" onclick="importarJSON()">Importar / fusionar</button></div><label>Pegar JSON de una ficha o lista de fichas</label><textarea id="jsonIn" style="min-height:360px" placeholder='{"schema":"acuarionexo.ficha.v4",...}'></textarea><p class="small">Al importar se normaliza al esquema V4 y se conserva tarjeta.fondo.</p></article></section>`)}
function importarJSON(){try{let data=JSON.parse(val('jsonIn')),arr=Array.isArray(data)?data:[data];arr.map(normaliza).forEach(f=>{let i=fichas.findIndex(x=>x.id===f.id);if(i>=0)fichas[i]=f;else fichas.unshift(f)});save();vista('lista')}catch(e){alert('JSON no válido: '+e.message)}}
function descargar(){const blob=new Blob([JSON.stringify(fichas,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='acuarionexo_fichas_v4.json';a.click();URL.revokeObjectURL(a.href)}function copiarExport(){copiarTexto(JSON.stringify(fichas,null,2));alert('JSON copiado.')}
function vista(m){if(m==='lista')vistaLista();else if(m==='foto')vistaFoto();else if(m==='ia')vistaIA();else if(m==='json')vistaJSON();else vistaLista()}
load();vista('lista');
</script>
