<!doctype html>
<html lang="es">
<head>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
:root{--bg:#06111c;--card:#0d2032;--card2:#102a42;--txt:#eff9ff;--muted:#a7bfd1;--line:rgba(255,255,255,.13);--blue:#4bd7ff;--green:#56e39f;--yellow:#ffd166;--red:#ff7474;--r:22px;--shadow:0 18px 55px rgba(0,0,0,.35)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at top right,rgba(75,215,255,.15),transparent 34%),radial-gradient(circle at bottom left,rgba(86,227,159,.12),transparent 30%),var(--bg);color:var(--txt);padding:env(safe-area-inset-top) 0 96px;min-height:100vh}button,input,select,textarea{font:inherit}button{border:0;border-radius:16px;padding:13px 15px;background:#183752;color:var(--txt);font-weight:800;box-shadow:inset 0 0 0 1px var(--line)}button.primary{background:linear-gradient(135deg,#1f93ff,#48d6ff);color:#03111c}button.good{background:linear-gradient(135deg,#22c878,#67eeb2);color:#03140c}button.warn{background:linear-gradient(135deg,#ffb84d,#ffd166);color:#281700}button.danger{background:#4d1921;color:#ffe0e0}.wrap{max-width:1040px;margin:auto;padding:12px}.hero{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(16,42,66,.95),rgba(6,17,28,.95));box-shadow:var(--shadow);position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:4;backdrop-filter:blur(14px)}.logo{width:58px;height:58px;border-radius:18px;background:#fff}.hero h1{margin:0;font-size:22px}.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:14px}.panel{grid-column:span 12;background:rgba(13,32,50,.9);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}.half{grid-column:span 6}.third{grid-column:span 4}h2,h3{margin:0 0 12px}.small{font-size:13px;color:var(--muted)}label{display:block;margin:12px 0 6px;color:#cbe4f7;font-size:13px;font-weight:800}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:15px;background:#061624;color:var(--txt);padding:13px 14px;outline:none}textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;flex-wrap:wrap}.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(4,14,22,.9);border-top:1px solid var(--line);backdrop-filter:blur(16px);z-index:5}.tabs button{font-size:12px;padding:10px 6px}.tabs button.active{background:linear-gradient(135deg,#1f93ff,#48d6ff);color:#03111c}.library{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.fichaCard{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:linear-gradient(145deg,rgba(16,42,66,.9),rgba(7,18,30,.9));box-shadow:var(--shadow)}.fichaImg{height:170px;background:#061624;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:42px;overflow:hidden}.fichaImg img{width:100%;height:100%;object-fit:cover}.fichaBody{padding:14px}.fichaBody h3{font-size:18px;margin-bottom:4px}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:6px 10px;margin:4px 4px 0 0;color:#d8eefb;background:rgba(255,255,255,.06);font-size:12px}.alert{border-left:4px solid var(--yellow);background:rgba(255,209,102,.1);padding:9px 10px;border-radius:12px;margin-top:10px;color:#ffe4a7}.ok{border-left-color:var(--green);background:rgba(86,227,159,.1);color:#d9ffed}.bad{border-left-color:var(--red);background:rgba(255,116,116,.1);color:#ffdada}.photoPreview{width:100%;max-height:300px;object-fit:cover;border-radius:18px;border:1px solid var(--line);margin-top:10px}.detailHero{display:grid;grid-template-columns:170px 1fr;gap:15px;align-items:center}.detailPhoto{width:170px;height:170px;border-radius:24px;border:1px solid var(--line);object-fit:cover;background:#061624}.section{border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;background:rgba(255,255,255,.04)}.section h3{color:#dff7ff}.preview{white-space:pre-wrap;line-height:1.45}.schema{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre-wrap;background:#04101b;border:1px solid var(--line);border-radius:16px;padding:12px;max-height:360px;overflow:auto}.empty{padding:22px;border:1px dashed rgba(255,255,255,.22);border-radius:18px;color:var(--muted);text-align:center}.notice{background:rgba(75,215,255,.1);border:1px solid rgba(75,215,255,.22);border-radius:16px;padding:12px;color:#dcf8ff}@media(max-width:760px){.wrap{padding:10px}.hero{border-radius:22px}.logo{width:52px;height:52px}.half,.third{grid-column:span 12}.row,.detailHero{grid-template-columns:1fr}.detailPhoto{width:100%;height:230px}.actions button{flex:1 1 auto}.panel{padding:14px}}
</style>
</head>
<body>
<main class="wrap"><header class="hero"><img class="logo" src="logo.svg" alt="Logo"><div><h1>Creador de Fichas</h1><p>Tarjeta corta por fuera · ficha completa estructurada para IA por dentro</p></div></header><div id="app"></div></main>
<nav class="tabs"><button id="tab-lista" onclick="vista('lista')">📚 Fichas</button><button id="tab-nueva" onclick="nuevaFicha()">✍️ Crear</button><button id="tab-ia" onclick="vista('ia')">🤖 IA</button><button id="tab-json" onclick="vista('json')">⇄ JSON</button></nav>
<script>
const KEY='acuarionexo_creador_fichas_v3';
const OLD=['acuarionexo_creador_fichas_v2','acuarionexo_creador_fichas_v1'];
const app=document.getElementById('app');let fichas=[],actual=null,modo='lista';
function id(){return 'ficha_'+Date.now()+'_'+Math.random().toString(16).slice(2)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function val(k){return (document.getElementById(k)?.value||'').trim()}
function arr(t){return String(t||'').split('\n').map(x=>x.trim()).filter(Boolean)}
function csv(t){return String(t||'').split(',').map(x=>x.trim()).filter(Boolean)}
function save(){localStorage.setItem(KEY,JSON.stringify(fichas))}
function render(h){app.innerHTML=h;scrollTo(0,0);document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+modo)?.classList.add('active')}
function tipoTxt(t){return ({animal_pez:'Pez',animal_coral:'Coral',animal_invertebrado:'Invertebrado',planta:'Planta',microfauna:'Microfauna',producto:'Producto',sal:'Sal',test:'Test',medicamento:'Medicamento',alimento:'Alimento',equipo:'Equipo',enfermedad:'Enfermedad',guia:'Guía',otro:'Otro'}[t]||t||'Sin tipo')}
function iconoTipo(t){return ({animal_pez:'🐟',animal_coral:'🪸',animal_invertebrado:'🦐',planta:'🌿',microfauna:'🧫',producto:'🧴',sal:'🧂',test:'🧪',medicamento:'💊',alimento:'🍽️',equipo:'⚙️',enfermedad:'⚠️',guia:'📘'}[t]||'📄')}
function base(){const now=new Date().toISOString();return{schema:'acuarionexo.ficha.v3',id:id(),tipo_ficha:'animal_pez',estado:'borrador',verificado:false,tarjeta:{titulo:'',subtitulo:'',resumen_corto:'',aviso_rapido:'',chips:[]},identificacion:{nombre_comun:'',nombre_cientifico:'',marca:'',modelo:'',fabricante:'',otros_nombres:''},clasificacion:{grupo:'',familia:'',ambito:'marino',origen:'',reef_safe:'pendiente'},detalle:{descripcion:'',uso_principal:'',observaciones:''},parametros:{temperatura:'',salinidad:'',ph:'',kh:'',gh:'',no3:'',po4:'',calcio:'',magnesio:'',otros:''},cuidados:{dificultad:'Media',tamano_adulto:'',litros_minimos:'',zona:'',luz:'',flujo:'',mantenimiento:'',aclimatacion:'',cuarentena:''},compatibilidad:{temperamento:'',compatible_con:'',evitar_con:'',corales:'',plantas:'',invertebrados:'',notas:''},alimentacion:{tipo:'',frecuencia:'',alimentos:'',suplementos:'',notas:''},producto:{categoria:'',composicion:'',dosificacion:'',modo_uso:'',precauciones:'',conservacion:'',compatibilidad:''},riesgos:{toxicidad:'',enfermedades:'',plagas:'',errores_frecuentes:'',alertas_ia:[]},ia:{resumen_para_ia:'',keywords:[],destino:'biblioteca',prioridad:'normal',puede_crear_animal:true,puede_crear_producto:false},fuentes:[],media:{foto:''},created_at:now,updated_at:now}}
function normaliza(f){if(f.schema==='acuarionexo.ficha.v3')return f;let b=base();if(f.schema==='acuarionexo.ficha.v2'){b.id=f.id||b.id;b.tipo_ficha=f.tipo_ficha||b.tipo_ficha;b.estado=f.estado_revision?.estado||'borrador';b.verificado=!!f.estado_revision?.verificado;b.identificacion={...b.identificacion,...(f.identificacion||{})};b.clasificacion={...b.clasificacion,...(f.clasificacion||{})};b.detalle.descripcion=f.contenido?.descripcion||'';b.detalle.uso_principal=f.contenido?.uso_principal||'';b.detalle.observaciones=f.contenido?.observaciones||'';b.parametros={...b.parametros,...(f.parametros||{})};b.cuidados={...b.cuidados,...(f.cuidados||{})};b.compatibilidad={...b.compatibilidad,...(f.compatibilidad||{})};b.alimentacion.tipo=f.alimentacion?.tipo||'';b.alimentacion.frecuencia=f.alimentacion?.frecuencia||'';b.alimentacion.alimentos=f.alimentacion?.alimentos_recomendados||'';b.alimentacion.suplementos=f.alimentacion?.suplementos||'';b.alimentacion.notas=f.alimentacion?.notas||'';b.producto={...b.producto,...(f.producto||{})};b.riesgos={...b.riesgos,...(f.riesgos_alertas||{})};b.ia.resumen_para_ia=f.ia_contexto?.resumen_para_ia||'';b.ia.keywords=f.ia_contexto?.keywords||[];b.ia.destino=f.uso_en_acuarionexo?.seccion_destino||'biblioteca';b.ia.prioridad=f.uso_en_acuarionexo?.prioridad_ia||'normal';b.ia.puede_crear_animal=!!f.uso_en_acuarionexo?.puede_crear_animal;b.ia.puede_crear_producto=!!f.uso_en_acuarionexo?.puede_crear_producto;b.fuentes=f.estado_revision?.fuentes||[];b.media.foto=f.media?.foto||'';b.tarjeta.titulo=f.identificacion?.nombre_comun||f.identificacion?.nombre_cientifico||f.identificacion?.marca||'';b.tarjeta.subtitulo=f.identificacion?.nombre_cientifico||f.identificacion?.modelo||'';b.tarjeta.resumen_corto=f.contenido?.resumen||'';return completaTarjeta(b)}
 b.id=f.id||b.id;b.tipo_ficha=({pez:'animal_pez',coral:'animal_coral',invertebrado:'animal_invertebrado',planta:'planta',microfauna:'microfauna',medicamento:'medicamento',alimento:'alimento',equipo:'equipo'}[f.tipo]||'otro');b.estado=f.estado||'borrador';b.identificacion.nombre_comun=f.nombre_comun||'';b.identificacion.nombre_cientifico=f.nombre_cientifico||'';b.identificacion.marca=f.marca||'';b.detalle.descripcion=f.descripcion||'';b.tarjeta.resumen_corto=f.resumen||'';b.cuidados.dificultad=f.dificultad||'Media';b.cuidados.litros_minimos=f.litros_minimos||'';b.cuidados.zona=f.zona||'';b.compatibilidad.notas=f.compatibilidad||'';b.alimentacion.notas=f.alimentacion||'';b.parametros.otros=f.parametros||'';b.riesgos.errores_frecuentes=f.riesgos||'';b.fuentes=(f.fuentes||'').split('\n').filter(Boolean);b.media.foto=f.foto||'';return completaTarjeta(b)}
function load(){try{fichas=JSON.parse(localStorage.getItem(KEY)||'[]').map(normaliza)}catch(e){fichas=[]}if(!fichas.length){for(const k of OLD){try{const old=JSON.parse(localStorage.getItem(k)||'[]');if(old.length){fichas=old.map(normaliza);save();break}}catch(e){}}}}
function titulo(f){return f.tarjeta?.titulo||f.identificacion?.nombre_comun||f.identificacion?.nombre_cientifico||f.identificacion?.marca||f.identificacion?.modelo||'Ficha sin nombre'}
function subtitulo(f){return f.tarjeta?.subtitulo||f.identificacion?.nombre_cientifico||f.identificacion?.modelo||f.identificacion?.fabricante||''}
function completaTarjeta(f){f.tarjeta=f.tarjeta||{};f.tarjeta.titulo=f.tarjeta.titulo||f.identificacion.nombre_comun||f.identificacion.nombre_cientifico||f.identificacion.marca||f.identificacion.modelo||'';f.tarjeta.subtitulo=f.tarjeta.subtitulo||f.identificacion.nombre_cientifico||[f.identificacion.marca,f.identificacion.modelo].filter(Boolean).join(' ');f.tarjeta.resumen_corto=f.tarjeta.resumen_corto||f.detalle.uso_principal||f.detalle.descripcion.slice(0,160);f.tarjeta.aviso_rapido=f.tarjeta.aviso_rapido||f.riesgos.alertas_ia?.[0]||f.producto.precauciones||'';f.tarjeta.chips=[tipoTxt(f.tipo_ficha),f.cuidados.dificultad,f.clasificacion.reef_safe,f.ia.destino].filter(Boolean).slice(0,4);return f}
function getForm(){let f=actual||base();f=JSON.parse(JSON.stringify(f));f.tipo_ficha=val('tipo_ficha');f.estado=val('estado');f.verificado=val('verificado')==='si';f.identificacion={nombre_comun:val('nombre_comun'),nombre_cientifico:val('nombre_cientifico'),marca:val('marca'),modelo:val('modelo'),fabricante:val('fabricante'),otros_nombres:val('otros_nombres')};f.clasificacion={grupo:val('grupo'),familia:val('familia'),ambito:val('ambito'),origen:val('origen'),reef_safe:val('reef_safe')};f.tarjeta={titulo:val('card_titulo'),subtitulo:val('card_subtitulo'),resumen_corto:val('card_resumen'),aviso_rapido:val('card_aviso'),chips:csv(val('card_chips'))};f.detalle={descripcion:val('descripcion'),uso_principal:val('uso_principal'),observaciones:val('observaciones')};f.parametros={temperatura:val('temperatura'),salinidad:val('salinidad'),ph:val('ph'),kh:val('kh'),gh:val('gh'),no3:val('no3'),po4:val('po4'),calcio:val('calcio'),magnesio:val('magnesio'),otros:val('param_otros')};f.cuidados={dificultad:val('dificultad'),tamano_adulto:val('tamano_adulto'),litros_minimos:val('litros_minimos'),zona:val('zona'),luz:val('luz'),flujo:val('flujo'),mantenimiento:val('mantenimiento'),aclimatacion:val('aclimatacion'),cuarentena:val('cuarentena')};f.compatibilidad={temperamento:val('temperamento'),compatible_con:val('compatible_con'),evitar_con:val('evitar_con'),corales:val('corales'),plantas:val('plantas'),invertebrados:val('invertebrados'),notas:val('compat_notas')};f.alimentacion={tipo:val('alim_tipo'),frecuencia:val('frecuencia'),alimentos:val('alimentos'),suplementos:val('suplementos'),notas:val('alim_notas')};f.producto={categoria:val('prod_categoria'),composicion:val('composicion'),dosificacion:val('dosificacion'),modo_uso:val('modo_uso'),precauciones:val('precauciones'),conservacion:val('conservacion'),compatibilidad:val('prod_compat')};f.riesgos={toxicidad:val('toxicidad'),enfermedades:val('enfermedades'),plagas:val('plagas'),errores_frecuentes:val('errores'),alertas_ia:arr(val('alertas_ia'))};f.ia={resumen_para_ia:val('resumen_ia'),keywords:csv(val('keywords')),destino:val('destino'),prioridad:val('prioridad'),puede_crear_animal:val('crear_animal')==='si',puede_crear_producto:val('crear_producto')==='si'};f.fuentes=arr(val('fuentes'));f.media={foto:document.getElementById('fotoData')?.value||''};f.updated_at=new Date().toISOString();return completaTarjeta(f)}
function guardar(){let f=getForm();if(titulo(f)==='Ficha sin nombre'){alert('Pon título, nombre, marca o modelo.');return}let i=fichas.findIndex(x=>x.id===f.id);if(i>=0)fichas[i]=f;else fichas.unshift(f);save();actual=f;detalle(f.id)}
function nuevaFicha(){modo='nueva';actual=base();render(editor(actual))}
function editar(idf){let f=fichas.find(x=>x.id===idf);if(!f)return;modo='nueva';actual=JSON.parse(JSON.stringify(f));render(editor(actual))}
function borrar(idf){if(!confirm('¿Eliminar esta ficha?'))return;fichas=fichas.filter(x=>x.id!==idf);save();vista('lista')}
function duplicar(idf){let f=fichas.find(x=>x.id===idf);if(!f)return;let n=JSON.parse(JSON.stringify(f));n.id=id();n.tarjeta.titulo=titulo(n)+' copia';n.estado='borrador';n.created_at=new Date().toISOString();n.updated_at=n.created_at;fichas.unshift(n);save();editar(n.id)}
function card(f){return `<article class="fichaCard" onclick="detalle('${f.id}')"><div class="fichaImg">${f.media.foto?`<img src="${f.media.foto}">`:iconoTipo(f.tipo_ficha)}</div><div class="fichaBody"><h3>${esc(titulo(f))}</h3><p class="small">${esc(subtitulo(f))}</p><p>${esc(f.tarjeta.resumen_corto||'Sin resumen corto.')}</p><div>${(f.tarjeta.chips||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>${f.tarjeta.aviso_rapido?`<div class="alert">${esc(f.tarjeta.aviso_rapido)}</div>`:''}<div class="actions" style="margin-top:10px"><button class="primary" onclick="event.stopPropagation();detalle('${f.id}')">Ver ficha</button><button onclick="event.stopPropagation();editar('${f.id}')">Editar</button></div></div></article>`}
function vistaLista(){modo='lista';let q=(document.getElementById('buscar')?.value||'').toLowerCase();let arrf=fichas.filter(f=>!q||JSON.stringify(f).toLowerCase().includes(q));render(`<section class="grid"><article class="panel"><div class="actions"><button class="primary" onclick="nuevaFicha()">+ Nueva ficha</button><button onclick="descargar()">Descargar JSON</button><button onclick="copiarExport()">Copiar JSON</button></div><label>Buscar</label><input id="buscar" value="${esc(q)}" placeholder="pez, coral, producto, marca, uso..." oninput="vistaLista()"><p class="small">Vista exterior resumida. Pulsa una tarjeta para abrir toda la ficha.</p></article><article class="panel"><div class="library">${arrf.length?arrf.map(card).join(''):'<div class="empty">Sin fichas todavía.</div>'}</div></article></section>`)}
function bloque(t,html){return `<div class="section"><h3>${t}</h3>${html}</div>`}
function p(k,v){return v?`<p><b>${k}:</b> ${esc(v)}</p>`:''}
function detalle(idf){let f=fichas.find(x=>x.id===idf)||actual;if(!f)return;modo='lista';render(`<section class="grid"><article class="panel"><div class="actions"><button onclick="vista('lista')">← Fichas</button><button class="primary" onclick="editar('${f.id}')">Editar</button><button onclick="duplicar('${f.id}')">Duplicar</button><button onclick="copiarPrompt('${f.id}')">Prompt IA</button><button class="danger" onclick="borrar('${f.id}')">Eliminar</button></div><div class="detailHero">${f.media.foto?`<img class="detailPhoto" src="${f.media.foto}">`:`<div class="detailPhoto" style="display:flex;align-items:center;justify-content:center;font-size:60px">${iconoTipo(f.tipo_ficha)}</div>`}<div><h2>${esc(titulo(f))}</h2><p class="small">${esc(subtitulo(f))}</p>${(f.tarjeta.chips||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}${f.tarjeta.aviso_rapido?`<div class="alert">${esc(f.tarjeta.aviso_rapido)}</div>`:''}</div></div>${bloque('Resumen visible',p('Resumen',f.tarjeta.resumen_corto)+p('Tipo',tipoTxt(f.tipo_ficha))+p('Destino IA',f.ia.destino))}${bloque('Identificación',p('Nombre común',f.identificacion.nombre_comun)+p('Nombre científico',f.identificacion.nombre_cientifico)+p('Marca',f.identificacion.marca)+p('Modelo',f.identificacion.modelo)+p('Fabricante',f.identificacion.fabricante)+p('Otros nombres',f.identificacion.otros_nombres))}${bloque('Descripción y uso',p('Descripción',f.detalle.descripcion)+p('Uso principal',f.detalle.uso_principal)+p('Observaciones',f.detalle.observaciones))}${bloque('Parámetros',p('Temperatura',f.parametros.temperatura)+p('Salinidad',f.parametros.salinidad)+p('pH',f.parametros.ph)+p('KH',f.parametros.kh)+p('GH',f.parametros.gh)+p('NO3',f.parametros.no3)+p('PO4',f.parametros.po4)+p('Calcio',f.parametros.calcio)+p('Magnesio',f.parametros.magnesio)+p('Otros',f.parametros.otros))}${bloque('Cuidados',p('Dificultad',f.cuidados.dificultad)+p('Tamaño adulto',f.cuidados.tamano_adulto)+p('Litros mínimos',f.cuidados.litros_minimos)+p('Zona',f.cuidados.zona)+p('Luz',f.cuidados.luz)+p('Flujo',f.cuidados.flujo)+p('Mantenimiento',f.cuidados.mantenimiento)+p('Aclimatación',f.cuidados.aclimatacion)+p('Cuarentena',f.cuidados.cuarentena))}${bloque('Compatibilidad',p('Temperamento',f.compatibilidad.temperamento)+p('Compatible con',f.compatibilidad.compatible_con)+p('Evitar con',f.compatibilidad.evitar_con)+p('Corales',f.compatibilidad.corales)+p('Plantas',f.compatibilidad.plantas)+p('Invertebrados',f.compatibilidad.invertebrados)+p('Notas',f.compatibilidad.notas))}${bloque('Alimentación',p('Tipo',f.alimentacion.tipo)+p('Frecuencia',f.alimentacion.frecuencia)+p('Alimentos',f.alimentacion.alimentos)+p('Suplementos',f.alimentacion.suplementos)+p('Notas',f.alimentacion.notas))}${bloque('Producto / equipo',p('Categoría',f.producto.categoria)+p('Composición',f.producto.composicion)+p('Dosificación',f.producto.dosificacion)+p('Modo de uso',f.producto.modo_uso)+p('Precauciones',f.producto.precauciones)+p('Conservación',f.producto.conservacion)+p('Compatibilidad',f.producto.compatibilidad))}${bloque('Riesgos y alertas IA',p('Toxicidad',f.riesgos.toxicidad)+p('Enfermedades',f.riesgos.enfermedades)+p('Plagas',f.riesgos.plagas)+p('Errores frecuentes',f.riesgos.errores_frecuentes)+(f.riesgos.alertas_ia||[]).map(x=>`<div class="alert bad">${esc(x)}</div>`).join(''))}${bloque('Fuentes y JSON',p('Verificado',f.verificado?'Sí':'No')+p('Fuentes',(f.fuentes||[]).join(' · '))+`<div class="schema">${esc(JSON.stringify(f,null,2))}</div>`)}</article></section>`)}
function editor(f){let chips=(f.tarjeta.chips||[]).join(', '),alerts=(f.riesgos.alertas_ia||[]).join('\n'),keys=(f.ia.keywords||[]).join(', '),fuentes=(f.fuentes||[]).join('\n');return `<section class="grid"><article class="panel"><div class="actions"><button onclick="vista('lista')">← Lista</button><button class="warn" onclick="autoEstructura()">Auto estructura</button><button class="primary" onclick="prepararPrompt()">Prompt IA</button><button class="good" onclick="guardar()">Guardar</button></div><h2>Ficha estructurada</h2><h3>Tarjeta exterior</h3><label>Título visible</label><input id="card_titulo" value="${esc(f.tarjeta.titulo)}"><label>Subtítulo visible</label><input id="card_subtitulo" value="${esc(f.tarjeta.subtitulo)}"><label>Resumen corto visible por fuera</label><textarea id="card_resumen">${esc(f.tarjeta.resumen_corto)}</textarea><label>Aviso rápido visible</label><input id="card_aviso" value="${esc(f.tarjeta.aviso_rapido)}"><label>Chips visibles, separados por coma</label><input id="card_chips" value="${esc(chips)}"><h3>Tipo e identificación</h3><div class="row"><div><label>Tipo ficha</label><select id="tipo_ficha"><option value="animal_pez" ${f.tipo_ficha==='animal_pez'?'selected':''}>Pez</option><option value="animal_coral" ${f.tipo_ficha==='animal_coral'?'selected':''}>Coral</option><option value="animal_invertebrado" ${f.tipo_ficha==='animal_invertebrado'?'selected':''}>Invertebrado</option><option value="planta" ${f.tipo_ficha==='planta'?'selected':''}>Planta</option><option value="microfauna" ${f.tipo_ficha==='microfauna'?'selected':''}>Microfauna</option><option value="producto" ${f.tipo_ficha==='producto'?'selected':''}>Producto</option><option value="sal" ${f.tipo_ficha==='sal'?'selected':''}>Sal</option><option value="test" ${f.tipo_ficha==='test'?'selected':''}>Test</option><option value="medicamento" ${f.tipo_ficha==='medicamento'?'selected':''}>Medicamento</option><option value="alimento" ${f.tipo_ficha==='alimento'?'selected':''}>Alimento</option><option value="equipo" ${f.tipo_ficha==='equipo'?'selected':''}>Equipo</option><option value="enfermedad" ${f.tipo_ficha==='enfermedad'?'selected':''}>Enfermedad</option><option value="guia" ${f.tipo_ficha==='guia'?'selected':''}>Guía</option><option value="otro" ${f.tipo_ficha==='otro'?'selected':''}>Otro</option></select></div><div><label>Estado</label><select id="estado"><option ${f.estado==='borrador'?'selected':''}>borrador</option><option ${f.estado==='revisar'?'selected':''}>revisar</option><option ${f.estado==='lista'?'selected':''}>lista</option></select></div></div><label>Nombre común</label><input id="nombre_comun" value="${esc(f.identificacion.nombre_comun)}"><label>Nombre científico</label><input id="nombre_cientifico" value="${esc(f.identificacion.nombre_cientifico)}"><div class="row"><div><label>Marca</label><input id="marca" value="${esc(f.identificacion.marca)}"></div><div><label>Modelo/producto</label><input id="modelo" value="${esc(f.identificacion.modelo)}"></div></div><div class="row"><div><label>Fabricante</label><input id="fabricante" value="${esc(f.identificacion.fabricante)}"></div><div><label>Otros nombres</label><input id="otros_nombres" value="${esc(f.identificacion.otros_nombres)}"></div></div><h3>Clasificación</h3><div class="row"><div><label>Grupo</label><input id="grupo" value="${esc(f.clasificacion.grupo)}"></div><div><label>Familia</label><input id="familia" value="${esc(f.clasificacion.familia)}"></div></div><div class="row"><div><label>Ámbito</label><select id="ambito"><option ${f.clasificacion.ambito==='marino'?'selected':''}>marino</option><option ${f.clasificacion.ambito==='reef'?'selected':''}>reef</option><option ${f.clasificacion.ambito==='dulce'?'selected':''}>dulce</option><option ${f.clasificacion.ambito==='general'?'selected':''}>general</option></select></div><div><label>Reef safe/plantas</label><input id="reef_safe" value="${esc(f.clasificacion.reef_safe)}"></div></div><label>Origen</label><input id="origen" value="${esc(f.clasificacion.origen)}"><h3>Detalle completo</h3><label>Descripción</label><textarea id="descripcion">${esc(f.detalle.descripcion)}</textarea><label>Uso principal</label><textarea id="uso_principal">${esc(f.detalle.uso_principal)}</textarea><label>Observaciones</label><textarea id="observaciones">${esc(f.detalle.observaciones)}</textarea><h3>Parámetros</h3><div class="row"><input id="temperatura" placeholder="Temperatura" value="${esc(f.parametros.temperatura)}"><input id="salinidad" placeholder="Salinidad" value="${esc(f.parametros.salinidad)}"></div><div class="row"><input id="ph" placeholder="pH" value="${esc(f.parametros.ph)}"><input id="kh" placeholder="KH" value="${esc(f.parametros.kh)}"></div><div class="row"><input id="gh" placeholder="GH" value="${esc(f.parametros.gh)}"><input id="no3" placeholder="NO3" value="${esc(f.parametros.no3)}"></div><div class="row"><input id="po4" placeholder="PO4" value="${esc(f.parametros.po4)}"><input id="calcio" placeholder="Calcio" value="${esc(f.parametros.calcio)}"></div><div class="row"><input id="magnesio" placeholder="Magnesio" value="${esc(f.parametros.magnesio)}"><input id="param_otros" placeholder="Otros" value="${esc(f.parametros.otros)}"></div><h3>Cuidados</h3><div class="row"><input id="dificultad" placeholder="Dificultad" value="${esc(f.cuidados.dificultad)}"><input id="tamano_adulto" placeholder="Tamaño adulto" value="${esc(f.cuidados.tamano_adulto)}"></div><div class="row"><input id="litros_minimos" placeholder="Litros mínimos" value="${esc(f.cuidados.litros_minimos)}"><input id="zona" placeholder="Zona" value="${esc(f.cuidados.zona)}"></div><div class="row"><input id="luz" placeholder="Luz" value="${esc(f.cuidados.luz)}"><input id="flujo" placeholder="Flujo" value="${esc(f.cuidados.flujo)}"></div><textarea id="mantenimiento" placeholder="Mantenimiento">${esc(f.cuidados.mantenimiento)}</textarea><textarea id="aclimatacion" placeholder="Aclimatación">${esc(f.cuidados.aclimatacion)}</textarea><textarea id="cuarentena" placeholder="Cuarentena">${esc(f.cuidados.cuarentena)}</textarea><h3>Compatibilidad</h3><input id="temperamento" placeholder="Temperamento" value="${esc(f.compatibilidad.temperamento)}"><textarea id="compatible_con" placeholder="Compatible con">${esc(f.compatibilidad.compatible_con)}</textarea><textarea id="evitar_con" placeholder="Evitar con">${esc(f.compatibilidad.evitar_con)}</textarea><textarea id="corales" placeholder="Corales">${esc(f.compatibilidad.corales)}</textarea><textarea id="plantas" placeholder="Plantas">${esc(f.compatibilidad.plantas)}</textarea><textarea id="invertebrados" placeholder="Invertebrados">${esc(f.compatibilidad.invertebrados)}</textarea><textarea id="compat_notas" placeholder="Notas compatibilidad">${esc(f.compatibilidad.notas)}</textarea><h3>Alimentación</h3><input id="alim_tipo" placeholder="Tipo" value="${esc(f.alimentacion.tipo)}"><input id="frecuencia" placeholder="Frecuencia" value="${esc(f.alimentacion.frecuencia)}"><textarea id="alimentos" placeholder="Alimentos">${esc(f.alimentacion.alimentos)}</textarea><textarea id="suplementos" placeholder="Suplementos">${esc(f.alimentacion.suplementos)}</textarea><textarea id="alim_notas" placeholder="Notas alimentación">${esc(f.alimentacion.notas)}</textarea><h3>Producto / equipo</h3><input id="prod_categoria" placeholder="Categoría" value="${esc(f.producto.categoria)}"><textarea id="composicion" placeholder="Composición / ingredientes">${esc(f.producto.composicion)}</textarea><textarea id="dosificacion" placeholder="Dosificación">${esc(f.producto.dosificacion)}</textarea><textarea id="modo_uso" placeholder="Modo de uso">${esc(f.producto.modo_uso)}</textarea><textarea id="precauciones" placeholder="Precauciones">${esc(f.producto.precauciones)}</textarea><input id="conservacion" placeholder="Conservación" value="${esc(f.producto.conservacion)}"><textarea id="prod_compat" placeholder="Compatibilidad producto">${esc(f.producto.compatibilidad)}</textarea><h3>Riesgos y alertas</h3><textarea id="toxicidad" placeholder="Toxicidad">${esc(f.riesgos.toxicidad)}</textarea><textarea id="enfermedades" placeholder="Enfermedades">${esc(f.riesgos.enfermedades)}</textarea><textarea id="plagas" placeholder="Plagas">${esc(f.riesgos.plagas)}</textarea><textarea id="errores" placeholder="Errores frecuentes">${esc(f.riesgos.errores_frecuentes)}</textarea><textarea id="alertas_ia" placeholder="Alertas IA, una por línea">${esc(alerts)}</textarea><h3>IA y exportación</h3><div class="row"><input id="destino" placeholder="Destino" value="${esc(f.ia.destino)}"><input id="prioridad" placeholder="Prioridad" value="${esc(f.ia.prioridad)}"></div><div class="row"><select id="crear_animal"><option value="si" ${f.ia.puede_crear_animal?'selected':''}>Puede crear animal: sí</option><option value="no" ${!f.ia.puede_crear_animal?'selected':''}>Puede crear animal: no</option></select><select id="crear_producto"><option value="no" ${!f.ia.puede_crear_producto?'selected':''}>Puede crear producto: no</option><option value="si" ${f.ia.puede_crear_producto?'selected':''}>Puede crear producto: sí</option></select></div><textarea id="resumen_ia" placeholder="Resumen para IA">${esc(f.ia.resumen_para_ia)}</textarea><input id="keywords" placeholder="Keywords" value="${esc(keys)}"><h3>Fuentes y foto</h3><select id="verificado"><option value="no" ${!f.verificado?'selected':''}>No verificado</option><option value="si" ${f.verificado?'selected':''}>Verificado</option></select><textarea id="fuentes" placeholder="Fuentes, una por línea">${esc(fuentes)}</textarea><input type="file" accept="image/*" onchange="foto(event)"><input id="fotoData" type="hidden" value="${esc(f.media.foto)}"><div id="fotoBox">${f.media.foto?`<img class="photoPreview" src="${f.media.foto}">`:''}</div><div class="actions" style="margin-top:16px"><button class="good" onclick="guardar()">Guardar ficha</button></div></article></section>`}
function foto(ev){let file=ev.target.files?.[0];if(!file)return;let r=new FileReader();r.onload=()=>{document.getElementById('fotoData').value=r.result;document.getElementById('fotoBox').innerHTML=`<img class="photoPreview" src="${r.result}">`};r.readAsDataURL(file)}
function autoEstructura(){let f=getForm(), name=titulo(f);if(name==='Ficha sin nombre'){alert('Pon primero nombre, marca o modelo.');return}document.getElementById('card_titulo').value=f.tarjeta.titulo||name;document.getElementById('card_subtitulo').value=f.tarjeta.subtitulo||subtitulo(f)||tipoTxt(f.tipo_ficha);document.getElementById('card_resumen').value=f.tarjeta.resumen_corto||`${name}: ${tipoTxt(f.tipo_ficha).toLowerCase()} pendiente de completar y verificar.`;document.getElementById('card_aviso').value=f.tarjeta.aviso_rapido||'Revisar compatibilidad, dosis/parámetros y fuentes antes de usar.';document.getElementById('card_chips').value=f.tarjeta.chips?.length?f.tarjeta.chips.join(', '):`${tipoTxt(f.tipo_ficha)}, ${f.clasificacion.ambito}, ${f.cuidados.dificultad}`;document.getElementById('resumen_ia').value=f.ia.resumen_para_ia||`La IA debe leer esta ficha como ${tipoTxt(f.tipo_ficha)}. Priorizar seguridad, compatibilidad, parámetros, uso y alertas.`}
function prompt(f){return `Completa esta ficha para AcuarioNexo. Devuelve SOLO JSON válido con el mismo esquema acuarionexo.ficha.v3. La tarjeta debe ser corta para vista exterior y el detalle debe ser completo para lectura IA. Si no verificas un dato, escribe "pendiente de verificar". Añade fuentes o términos de búsqueda.\n\n${JSON.stringify(f,null,2)}`}
function prepararPrompt(){let f=getForm();navigator.clipboard?.writeText(prompt(f));alert('Prompt copiado. Pégalo en Gemini/ChatGPT y luego pega la respuesta JSON en IA.')}
function copiarPrompt(idf){let f=fichas.find(x=>x.id===idf);navigator.clipboard?.writeText(prompt(f));alert('Prompt copiado.')}
function vistaIA(){modo='ia';render(`<section class="grid"><article class="panel"><h2>IA</h2><p class="notice">La IA debe devolver una ficha JSON v3: tarjeta corta + detalle completo. Así AcuarioNexo puede leerla después.</p><button class="primary" onclick="navigator.clipboard.writeText(prompt(actual||base()))">Copiar prompt base</button><label>Pega aquí JSON devuelto por la IA</label><textarea id="iaJson" style="min-height:260px"></textarea><button class="good" onclick="try{let f=normaliza(JSON.parse(val('iaJson')));let i=fichas.findIndex(x=>x.id===f.id);if(i>=0)fichas[i]=f;else fichas.unshift(f);save();detalle(f.id)}catch(e){alert('JSON no válido: '+e.message)}">Importar respuesta IA</button></article></section>`)}
function exportObj(){return{app:'AcuarioNexo Creador de Fichas',schema:'acuarionexo.fichas.export.v3',version:3,exported_at:new Date().toISOString(),fichas}}
function descargar(){let blob=new Blob([JSON.stringify(exportObj(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='acuarionexo_fichas_v3_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function copiarExport(){navigator.clipboard?.writeText(JSON.stringify(exportObj(),null,2));alert('JSON copiado.')}
function importar(){try{let data=JSON.parse(val('importTxt')),list=Array.isArray(data)?data:(data.fichas||[data]);let map=new Map(fichas.map(f=>[f.id,f]));list.forEach(x=>{let f=normaliza(x);map.set(f.id,f)});fichas=Array.from(map.values());save();vista('lista')}catch(e){alert('No pude importar: '+e.message)}}
function borrarTodo(){if(confirm('¿Borrar todas las fichas locales?')){fichas=[];save();vista('lista')}}
function vistaJSON(){modo='json';render(`<section class="grid"><article class="panel"><h2>JSON</h2><div class="actions"><button onclick="descargar()">Descargar</button><button onclick="copiarExport()">Copiar</button><button class="danger" onclick="borrarTodo()">Borrar locales</button></div><label>Importar JSON</label><textarea id="importTxt" style="min-height:240px"></textarea><button class="primary" onclick="importar()">Importar</button></article></section>`)}
function vista(v){if(v==='lista')return vistaLista();if(v==='ia')return vistaIA();if(v==='json')return vistaJSON();vistaLista()}
load();vista('lista');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
