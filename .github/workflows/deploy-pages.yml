# Activación de despliegue automático desde GitHub Actions
name: Deploy AcuarioNexo Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Stamp exact commit version
        run: node scripts/stamp-release.mjs "$GITHUB_SHA"

      - name: Regenerate map and tree
        run: npm run docs:refresh

      - name: Validate and generate exact active bundle
        run: |
          node scripts/validate-app.mjs
          node scripts/prepare-mobile-bundle.mjs
          npm run mobile:check

      - name: Verify deployed build matches commit
        run: |
          EXPECTED="release-${GITHUB_SHA::12}"
          ACTUAL=$(node -p "require('./app-version.json').build")
          test "$ACTUAL" = "$EXPECTED"
          grep -q "$EXPECTED" index.html
          grep -q "$EXPECTED" manifest.webmanifest
          grep -q "$EXPECTED" www/index.html
          grep -q "$EXPECTED" www/app-version.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload exact active app
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
