name: Trigger corrected TestFlight workflow once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-testflight-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Trigger corrected TestFlight workflow once'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected TestFlight workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/publish-testflight.yml/dispatches" \
            --data '{"ref":"main","inputs":{"marketing_version":"1.0","build_number":""}}'
