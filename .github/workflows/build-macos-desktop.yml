name: Build AcuarioNexo for macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'src/**'
      - 'scripts/**'
      - 'index.html'
      - 'app.js'
      - 'config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-macos-desktop.yml'

permissions:
  contents: read

concurrency:
  group: acuarionexo-macos-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate source application
        run: npm run check

      - name: Prepare desktop web bundle
        run: npm run desktop:prepare

      - name: Verify Electron entry points
        shell: bash
        run: |
          set -euo pipefail
          test -f electron/main.cjs
          test -f electron/preload.cjs
          test -f www/index.html
          node -e "const p=require('./package.json'); if(p.main!=='electron/main.cjs') process.exit(1);"

      - name: Build unsigned macOS application
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          if [ '${{ matrix.arch }}' = 'x64' ]; then
            npm run desktop:build:mac:x64
          else
            npm run desktop:build:mac:arm64
          fi

      - name: Validate generated package
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$(find dist-desktop -maxdepth 1 -type f -name 'AcuarioNexo-*.zip' -print -quit)"
          test -n "$ZIP_PATH"
          unzip -t "$ZIP_PATH"
          shasum -a 256 "$ZIP_PATH" | tee "AcuarioNexo-${{ matrix.arch }}.sha256"
          printf 'architecture=%s\npackage=%s\nvalidation=success\n' '${{ matrix.arch }}' "$ZIP_PATH" | tee "AcuarioNexo-${{ matrix.arch }}-validation.txt"

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: AcuarioNexo-macOS-${{ matrix.arch }}
          path: |
            dist-desktop/AcuarioNexo-*.zip
            AcuarioNexo-${{ matrix.arch }}.sha256
            AcuarioNexo-${{ matrix.arch }}-validation.txt
          if-no-files-found: error
          retention-days: 14