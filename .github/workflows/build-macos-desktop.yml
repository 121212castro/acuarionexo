name: Build, sign and notarize AcuarioNexo for macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'src/**'
      - 'scripts/**'
      - 'index.html'
      - 'app.js'
      - 'config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.mac.yml'
      - '.github/workflows/build-macos-desktop.yml'

permissions:
  contents: read

concurrency:
  group: acuarionexo-macos-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate source application
        run: npm run check

      - name: Prepare desktop web bundle
        run: npm run desktop:prepare

      - name: Resolve signing mode
        id: signing
        shell: bash
        env:
          MACOS_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$MACOS_P12" && -n "$MACOS_P12_PASSWORD" && -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" && -n "$ASC_PRIVATE_KEY" ]]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "SIGNED_BUILD=true" >> "$GITHUB_ENV"
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "SIGNED_BUILD=false" >> "$GITHUB_ENV"
            echo "Developer ID credentials are incomplete; generating an unsigned test build."
          fi

      - name: Prepare App Store Connect API key
        if: steps.signing.outputs.mode == 'signed'
        shell: bash
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build signed and notarized macOS application
        if: steps.signing.outputs.mode == 'signed'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          npx electron-builder --config electron-builder.mac.yml --mac zip --${{ matrix.arch }} --publish never

      - name: Build unsigned macOS test application
        if: steps.signing.outputs.mode == 'unsigned'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          npx electron-builder --config electron-builder.mac.yml --mac zip --${{ matrix.arch }} --publish never --config.mac.identity=null --config.mac.notarize=false --config.mac.hardenedRuntime=false

      - name: Validate signed application
        if: steps.signing.outputs.mode == 'signed'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find dist-desktop -type d -name 'AcuarioNexo.app' -print -quit)"
          ZIP_PATH="$(find dist-desktop -maxdepth 1 -type f -name 'AcuarioNexo-*.zip' -print -quit)"
          test -n "$APP_PATH"
          test -n "$ZIP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee "AcuarioNexo-${{ matrix.arch }}-codesign.txt"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -q 'Authority=Developer ID Application:'
          xcrun stapler validate -v "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH" 2>&1 | tee "AcuarioNexo-${{ matrix.arch }}-gatekeeper.txt"
          unzip -t "$ZIP_PATH"
          shasum -a 256 "$ZIP_PATH" | tee "AcuarioNexo-${{ matrix.arch }}.sha256"
          printf 'architecture=%s\npackage=%s\nsignature=Developer ID Application\nnotarization=accepted\ngatekeeper=accepted\n' '${{ matrix.arch }}' "$ZIP_PATH" | tee "AcuarioNexo-${{ matrix.arch }}-validation.txt"

      - name: Validate unsigned test application
        if: steps.signing.outputs.mode == 'unsigned'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find dist-desktop -type d -name 'AcuarioNexo.app' -print -quit)"
          ZIP_PATH="$(find dist-desktop -maxdepth 1 -type f -name 'AcuarioNexo-*.zip' -print -quit)"
          test -n "$APP_PATH"
          test -n "$ZIP_PATH"
          test -f "$APP_PATH/Contents/Info.plist"
          test -f "$APP_PATH/Contents/MacOS/AcuarioNexo"
          unzip -t "$ZIP_PATH"
          shasum -a 256 "$ZIP_PATH" | tee "AcuarioNexo-${{ matrix.arch }}.sha256"
          printf 'architecture=%s\npackage=%s\nsignature=unsigned-test-build\nnotarization=not-requested\ngatekeeper=manual-approval-required\n' '${{ matrix.arch }}' "$ZIP_PATH" | tee "AcuarioNexo-${{ matrix.arch }}-validation.txt"

      - name: Upload signed and notarized macOS application
        if: steps.signing.outputs.mode == 'signed'
        uses: actions/upload-artifact@v4
        with:
          name: AcuarioNexo-macOS-${{ matrix.arch }}-signed-notarized
          path: |
            dist-desktop/AcuarioNexo-*.zip
            AcuarioNexo-${{ matrix.arch }}.sha256
            AcuarioNexo-${{ matrix.arch }}-validation.txt
            AcuarioNexo-${{ matrix.arch }}-codesign.txt
            AcuarioNexo-${{ matrix.arch }}-gatekeeper.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned macOS test application
        if: steps.signing.outputs.mode == 'unsigned'
        uses: actions/upload-artifact@v4
        with:
          name: AcuarioNexo-macOS-${{ matrix.arch }}-unsigned-test
          path: |
            dist-desktop/AcuarioNexo-*.zip
            AcuarioNexo-${{ matrix.arch }}.sha256
            AcuarioNexo-${{ matrix.arch }}-validation.txt
          if-no-files-found: error
          retention-days: 14

      - name: Clean temporary notarization key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
