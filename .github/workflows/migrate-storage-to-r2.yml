name: Migrar Supabase Storage a Cloudflare R2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/r2-migration-trigger.txt'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Migrate public library media to R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: acuarionexo-media
        run: npm run r2:migrate

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-migration-result
          path: data/r2-migration-result.json
          if-no-files-found: warn
