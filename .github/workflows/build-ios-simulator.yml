name: Build and validate iOS Simulator app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install dependencies
        run: npm install

      - name: Validate complete web application
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee ios-build-error.log

      - name: Prepare and validate mobile bundle
        shell: bash
        run: |
          set -o pipefail
          npm run mobile:prepare 2>&1 | tee -a ios-build-error.log
          npm run mobile:check 2>&1 | tee -a ios-build-error.log

      - name: Generate iOS project from source assets
        shell: bash
        run: |
          set -o pipefail
          rm -rf ios ios-build
          npx cap add ios 2>&1 | tee -a ios-build-error.log
          npm run mobile:assets:prepare 2>&1 | tee -a ios-build-error.log
          npx --yes @capacitor/assets@3.0.5 generate --ios --iconBackgroundColor '#02111f' --splashBackgroundColor '#02111f' 2>&1 | tee -a ios-build-error.log
          npx cap sync ios 2>&1 | tee -a ios-build-error.log

      - name: Verify generated iOS configuration
        shell: bash
        run: |
          set -o pipefail
          test -f ios/App/App.xcodeproj/project.pbxproj
          test -f ios/App/App/Info.plist
          grep -R "com.acuarionexo.app" ios/App/App.xcodeproj/project.pbxproj
          find ios/App/App/Assets.xcassets -type f | sort | tee ios-assets-files.txt
          test -s ios-assets-files.txt

      - name: Build unsigned app for iPhone Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee -a ios-build-error.log

      - name: Install, launch and audit on iPhone Simulator
        shell: bash
        run: |
          chmod +x scripts/ios-simulator-audit.sh
          scripts/ios-simulator-audit.sh ios-build/Build/Products/Debug-iphonesimulator/App.app

      - name: Package simulator application
        if: success()
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent ios-build/Build/Products/Debug-iphonesimulator/App.app AcuarioNexo-iOS-Simulator.zip

      - name: Generate validation result
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          VALIDATED=false
          if [ "$STATUS" = "success" ] && [ -f ios-simulator-result.txt ] && grep -qx success ios-simulator-result.txt; then
            VALIDATED=true
          fi
          cat > ios-build-status.json <<EOF_STATUS
          {
            "status": "$STATUS",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "validated_on_simulator": $VALIDATED,
            "artifact": "AcuarioNexo-iOS-Simulator-Audit",
            "signed_for_device": false,
            "testflight_ready": false
          }
          EOF_STATUS

      - name: Upload iOS audit evidence and validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AcuarioNexo-iOS-Simulator-Audit
          path: |
            AcuarioNexo-iOS-Simulator.zip
            ios-build-status.json
            ios-launch.png
            ios-console.log
            ios-install.txt
            ios-launch.txt
            ios-app-container.txt
            ios-simulator-result.txt
            ios-simulator-audit.log
            ios-simulator-selection.txt
            ios-simulator-devices.txt
            ios-simulator-runtimes.txt
            ios-assets-files.txt
            ios-build-error.log
          if-no-files-found: warn
          retention-days: 14
