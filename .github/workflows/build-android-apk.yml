name: Build and validate Android APK

# Validación final Android: emulador estable y diagnóstico completo
on:
  push:
    branches: [main]
    paths-ignore:
      - android-build-status.json
      - android-build-error.log
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Validate complete web application
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee android-build-error.log

      - name: Prepare and validate mobile bundle
        shell: bash
        run: |
          set -o pipefail
          npm run mobile:prepare 2>&1 | tee -a android-build-error.log
          npm run mobile:check 2>&1 | tee -a android-build-error.log

      - name: Create Android project and official assets
        shell: bash
        run: |
          set -o pipefail
          rm -rf android
          npx cap add android 2>&1 | tee -a android-build-error.log
          npm run mobile:assets:android 2>&1 | tee -a android-build-error.log
          npx cap sync android 2>&1 | tee -a android-build-error.log

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a ../android-build-error.log

      - name: Verify generated launcher resources
        run: |
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          find android/app/src/main/res -type f -name 'ic_launcher*' | tee android-launcher-files.txt
          test -s android-launcher-files.txt

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AcuarioNexo-Android-Test.apk

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            set +e
            : > android-install.txt
            : > android-start.txt
            : > android-activities.txt
            : > android-logcat.txt
            : > app-pid.txt
            : > android-adb-status.txt

            adb devices -l >> android-adb-status.txt 2>&1
            DEVICE_STATUS=$?

            BOOT_STATUS=1
            for attempt in $(seq 1 60); do
              BOOT_VALUE="$(timeout 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
              if [ "$BOOT_VALUE" = "1" ]; then
                BOOT_STATUS=0
                break
              fi
              sleep 2
            done
            printf 'DEVICE_STATUS=%s\nBOOT_STATUS=%s\n' "$DEVICE_STATUS" "$BOOT_STATUS" >> android-adb-status.txt

            timeout 60s adb install -r AcuarioNexo-Android-Test.apk > android-install.txt 2>&1
            INSTALL_STATUS=$?

            timeout 10s adb logcat -c >> android-adb-status.txt 2>&1 || true
            timeout 10s adb shell am force-stop com.acuarionexo.app >> android-adb-status.txt 2>&1 || true
            timeout 15s adb shell am start -n com.acuarionexo.app/.MainActivity > android-start.txt 2>&1
            START_STATUS=$?

            PID_STATUS=1
            for attempt in $(seq 1 30); do
              timeout 5s adb shell pidof com.acuarionexo.app > app-pid.txt 2>/dev/null || true
              if test -s app-pid.txt; then
                PID_STATUS=0
                break
              fi
              sleep 2
            done

            sleep 15
            timeout 5s adb shell pidof com.acuarionexo.app > app-pid.txt 2>/dev/null || true
            test -s app-pid.txt || PID_STATUS=1
            timeout 15s adb shell dumpsys activity activities > android-activities.txt 2>&1 || true
            timeout 15s adb exec-out screencap -p > android-launch.png 2>/dev/null || true
            timeout 20s adb logcat -d > android-logcat.txt 2>&1 || true

            printf 'INSTALL_STATUS=%s\nSTART_STATUS=%s\nPID_STATUS=%s\n' "$INSTALL_STATUS" "$START_STATUS" "$PID_STATUS" >> android-adb-status.txt
            cat android-install.txt
            cat android-start.txt
            cat android-adb-status.txt

            FAILURE=0
            test "$DEVICE_STATUS" -eq 0 || FAILURE=1
            test "$BOOT_STATUS" -eq 0 || FAILURE=1
            test "$INSTALL_STATUS" -eq 0 || FAILURE=1
            test "$START_STATUS" -eq 0 || FAILURE=1
            test "$PID_STATUS" -eq 0 || FAILURE=1
            grep -qE 'com\.acuarionexo\.app/(\.MainActivity|com\.acuarionexo\.app\.MainActivity)' android-activities.txt || FAILURE=1
            if grep -A 20 'FATAL EXCEPTION' android-logcat.txt | grep -q 'Process: com.acuarionexo.app'; then
              FAILURE=1
            fi
            if grep -qE 'Process: com\.acuarionexo\.app.*has died|Force finishing activity com\.acuarionexo\.app|ANR in com\.acuarionexo\.app' android-logcat.txt; then
              FAILURE=1
            fi
            exit "$FAILURE"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AcuarioNexo-Android-Audit
          path: |
            AcuarioNexo-Android-Test.apk
            android-launch.png
            android-logcat.txt
            android-install.txt
            android-start.txt
            android-activities.txt
            android-adb-status.txt
            app-pid.txt
            android-launcher-files.txt
            android-build-error.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish tester release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test-latest --cleanup-tag --yes || true
          gh release create android-test-latest AcuarioNexo-Android-Test.apk \
            --title "AcuarioNexo Android validada" \
            --notes "APK validada: código web, paquete móvil, compilación, iconos, instalación, proceso activo, MainActivity visible y ausencia de cierres fatales en Android API 34 desde ${GITHUB_SHA}." \
            --prerelease

      - name: Record validation result
        if: always()
        run: |
          STATUS="${{ job.status }}"
          APK_URL=""
          if [ "$STATUS" = "success" ]; then
            APK_URL="https://github.com/121212castro/acuarionexo/releases/download/android-test-latest/AcuarioNexo-Android-Test.apk"
            rm -f android-build-error.log
          fi
          cat > android-build-status.json <<EOF
          {
            "status": "$STATUS",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "apk": "$APK_URL",
            "validated_on_emulator": $([ "$STATUS" = "success" ] && echo true || echo false)
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-build-status.json
          if [ -f android-build-error.log ]; then git add android-build-error.log; fi
          git commit -m "Registra validación Android [skip ci]" || exit 0
          git push
