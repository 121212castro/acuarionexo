name: Build and validate Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - android-build-status.json
      - android-build-error.log
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Validate complete web application
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee android-build-error.log

      - name: Prepare and validate mobile bundle
        shell: bash
        run: |
          set -o pipefail
          npm run mobile:prepare 2>&1 | tee -a android-build-error.log
          npm run mobile:check 2>&1 | tee -a android-build-error.log

      - name: Create Android project and official assets
        shell: bash
        run: |
          set -o pipefail
          rm -rf android
          npx cap add android 2>&1 | tee -a android-build-error.log
          npm run mobile:assets:android 2>&1 | tee -a android-build-error.log
          npx cap sync android 2>&1 | tee -a android-build-error.log

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a ../android-build-error.log

      - name: Verify generated launcher resources
        run: |
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          find android/app/src/main/res -type f -name 'ic_launcher*' | tee android-launcher-files.txt
          test -s android-launcher-files.txt

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AcuarioNexo-Android-Test.apk

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm

      - name: Install Android emulator image
        shell: bash
        run: |
          set -o pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          command -v sdkmanager
          command -v avdmanager
          command -v emulator
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64" 2>&1 | tee android-emulator-setup.txt
          echo no | avdmanager create avd --force --name AcuarioNexoTest --package "system-images;android-34;google_apis;x86_64" --device "pixel_6" 2>&1 | tee android-avd-create.txt
          emulator -list-avds | tee android-avd-list.txt
          grep -qx 'AcuarioNexoTest' android-avd-list.txt

      - name: Install and launch on Android emulator
        shell: bash
        run: |
          set +e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          : > android-install.txt
          : > android-start.txt
          : > android-activities.txt
          : > android-logcat.txt
          : > app-pid.txt
          : > android-adb-status.txt
          : > android-package.txt
          : > android-emulator.log

          adb kill-server >/dev/null 2>&1 || true
          nohup emulator -avd AcuarioNexoTest -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -no-metrics > android-emulator.log 2>&1 &
          EMULATOR_PID=$!
          printf 'EMULATOR_PID=%s\n' "$EMULATOR_PID" >> android-adb-status.txt

          timeout 180s adb wait-for-device >> android-adb-status.txt 2>&1
          DEVICE_STATUS=$?

          BOOT_STATUS=1
          BOOT_COMPLETED=""
          for attempt in $(seq 1 180); do
            BOOT_COMPLETED="$(timeout 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$BOOT_COMPLETED" = "1" ]; then
              BOOT_STATUS=0
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          printf 'BOOT_COMPLETED=%s\n' "$BOOT_COMPLETED" >> android-adb-status.txt
          timeout 10s adb shell input keyevent 82 >> android-adb-status.txt 2>&1 || true
          timeout 10s adb shell wm dismiss-keyguard >> android-adb-status.txt 2>&1 || true

          timeout 120s adb install -r -g AcuarioNexo-Android-Test.apk > android-install.txt 2>&1
          INSTALL_STATUS=$?

          timeout 15s adb shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER com.acuarionexo.app > android-package.txt 2>&1
          PACKAGE_STATUS=$?

          timeout 10s adb logcat -c >> android-adb-status.txt 2>&1 || true
          timeout 10s adb shell am force-stop com.acuarionexo.app >> android-adb-status.txt 2>&1 || true

          timeout 30s adb shell am start -W -S -n com.acuarionexo.app/.MainActivity > android-start.txt 2>&1
          START_STATUS=$?
          sleep 10

          timeout 10s adb shell pidof com.acuarionexo.app > app-pid.txt 2>/dev/null
          PID_STATUS=$?

          timeout 20s adb shell dumpsys activity activities > android-activities.txt 2>&1
          ACTIVITY_STATUS=$?
          timeout 15s adb shell dumpsys window windows >> android-activities.txt 2>&1 || true
          timeout 15s adb exec-out screencap -p > android-launch.png 2>/dev/null || true
          timeout 20s adb logcat -d -v threadtime > android-logcat.txt 2>&1
          LOGCAT_STATUS=$?

          printf 'DEVICE_STATUS=%s\nBOOT_STATUS=%s\nINSTALL_STATUS=%s\nPACKAGE_STATUS=%s\nSTART_STATUS=%s\nPID_STATUS=%s\nACTIVITY_STATUS=%s\nLOGCAT_STATUS=%s\n' \
            "$DEVICE_STATUS" "$BOOT_STATUS" "$INSTALL_STATUS" "$PACKAGE_STATUS" "$START_STATUS" "$PID_STATUS" "$ACTIVITY_STATUS" "$LOGCAT_STATUS" >> android-adb-status.txt
          cat android-install.txt
          cat android-package.txt
          cat android-start.txt
          cat android-adb-status.txt

          FAILURE=0
          test "$DEVICE_STATUS" -eq 0 || FAILURE=1
          test "$BOOT_STATUS" -eq 0 || FAILURE=1
          test "$INSTALL_STATUS" -eq 0 || FAILURE=1
          test "$PACKAGE_STATUS" -eq 0 || FAILURE=1
          test "$START_STATUS" -eq 0 || FAILURE=1
          test "$PID_STATUS" -eq 0 || FAILURE=1
          test "$ACTIVITY_STATUS" -eq 0 || FAILURE=1
          test "$LOGCAT_STATUS" -eq 0 || FAILURE=1
          test -s app-pid.txt || FAILURE=1
          grep -qE 'com\.acuarionexo\.app/(\.MainActivity|com\.acuarionexo\.app\.MainActivity)|mResumedActivity:.*com\.acuarionexo\.app|topResumedActivity=.*com\.acuarionexo\.app|mCurrentFocus=.*com\.acuarionexo\.app' android-activities.txt || FAILURE=1
          if grep -A 30 'FATAL EXCEPTION' android-logcat.txt | grep -q 'Process: com.acuarionexo.app'; then FAILURE=1; fi
          if grep -qE 'ANR in com\.acuarionexo\.app|Force finishing activity .*com\.acuarionexo\.app|Process com\.acuarionexo\.app .* has died' android-logcat.txt; then FAILURE=1; fi

          adb emu kill >/dev/null 2>&1 || true
          kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          wait "$EMULATOR_PID" >/dev/null 2>&1 || true
          exit "$FAILURE"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AcuarioNexo-Android-Audit
          path: |
            AcuarioNexo-Android-Test.apk
            android-launch.png
            android-logcat.txt
            android-install.txt
            android-start.txt
            android-activities.txt
            android-adb-status.txt
            android-package.txt
            app-pid.txt
            android-launcher-files.txt
            android-build-error.log
            android-emulator.log
            android-emulator-setup.txt
            android-avd-create.txt
            android-avd-list.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish tester release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test-latest --cleanup-tag --yes || true
          gh release create android-test-latest AcuarioNexo-Android-Test.apk \
            --title "AcuarioNexo Android validada" \
            --notes "APK validada: código web, paquete móvil, compilación, iconos, instalación, proceso activo, MainActivity visible y ausencia de cierres fatales en Android API 34 desde ${GITHUB_SHA}." \
            --prerelease

      - name: Record validation result
        if: always()
        run: |
          STATUS="${{ job.status }}"
          APK_URL=""
          if [ "$STATUS" = "success" ]; then
            APK_URL="https://github.com/121212castro/acuarionexo/releases/download/android-test-latest/AcuarioNexo-Android-Test.apk"
            rm -f android-build-error.log
          fi
          cat > android-build-status.json <<EOF_STATUS
          {
            "status": "$STATUS",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "apk": "$APK_URL",
            "validated_on_emulator": $([ "$STATUS" = "success" ] && echo true || echo false)
          }
          EOF_STATUS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-build-status.json
          if [ -f android-build-error.log ]; then git add android-build-error.log; fi
          git commit -m "Registra validación Android [skip ci]" || exit 0
          git push
