name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - android-build-status.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare mobile web bundle
        run: npm run mobile:prepare

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AcuarioNexo-Android-Test.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcuarioNexo-Android-Test
          path: AcuarioNexo-Android-Test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish tester release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test-latest --cleanup-tag --yes || true
          gh release create android-test-latest AcuarioNexo-Android-Test.apk \
            --title "AcuarioNexo Android Test" \
            --notes "APK de prueba generada automáticamente desde ${GITHUB_SHA}." \
            --prerelease

      - name: Record build result
        if: always()
        run: |
          STATUS="${{ job.status }}"
          APK_URL=""
          if [ "$STATUS" = "success" ]; then
            APK_URL="https://github.com/121212castro/acuarionexo/releases/download/android-test-latest/AcuarioNexo-Android-Test.apk"
          fi
          cat > android-build-status.json <<EOF
          {
            "status": "$STATUS",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "apk": "$APK_URL"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-build-status.json
          git commit -m "Registra resultado APK Android [skip ci]" || exit 0
          git push
