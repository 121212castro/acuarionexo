name: Android audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Validate web application
        run: npm run check

      - name: Prepare mobile bundle
        run: npm run mobile:prepare && npm run mobile:check

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npm run mobile:assets:android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: acuarionexo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Launch test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell monkey -p com.acuarionexo.app -c android.intent.category.LAUNCHER 1
            sleep 12
            adb shell pidof com.acuarionexo.app > app-pid.txt || true
            adb exec-out screencap -p > android-launch.png
            adb logcat -d > android-logcat.txt
            test -s app-pid.txt
            ! grep -E "FATAL EXCEPTION|Process: com\.acuarionexo\.app.*has died|AndroidRuntime:.*FATAL" android-logcat.txt

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-audit-evidence
          path: |
            android-launch.png
            android-logcat.txt
            app-pid.txt
          if-no-files-found: warn
