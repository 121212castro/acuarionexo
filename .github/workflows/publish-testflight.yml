name: Publish AcuarioNexo to TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: App Store marketing version
        required: true
        default: '1.0'
      build_number:
        description: Optional numeric build number; defaults to the GitHub run number
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: acuarionexo-testflight
  cancel-in-progress: false

env:
  APP_NAME: AcuarioNexo
  BUNDLE_ID: com.acuarionexo.app
  TEAM_ID: 636BUY8Z9W
  XCODE_PROJECT: ios/App/App.xcodeproj
  XCODE_SCHEME: App
  ARCHIVE_PATH: ios-build/AcuarioNexo.xcarchive
  EXPORT_PATH: ios-build/export
  AUDIT_ARTIFACT: AcuarioNexo-TestFlight-Audit

jobs:
  publish-testflight:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version | tee xcode-version.txt
          xcrun --sdk iphoneos --show-sdk-version | tee ios-sdk-version.txt
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" -ge 26

      - name: Strict preflight of all Apple credentials
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          DIST_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: python3 scripts/ci/testflight-preflight.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate complete web application
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee testflight-build.log

      - name: Prepare and validate mobile bundle
        shell: bash
        run: |
          set -euo pipefail
          npm run mobile:prepare 2>&1 | tee -a testflight-build.log
          npm run mobile:check 2>&1 | tee -a testflight-build.log

      - name: Resolve version and build
        shell: bash
        env:
          REQUESTED_BUILD: ${{ inputs.build_number }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${REQUESTED_BUILD:-$GITHUB_RUN_NUMBER}"
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"

      - name: Build, sign, validate and upload IPA
        shell: bash
        env:
          DIST_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: bash scripts/ci/testflight-publish.sh

      - name: Confirm build appears in App Store Connect
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          EXPECTED_BUILD: ${{ env.BUILD_NUMBER }}
        run: |
          set -euo pipefail
          CONFIRM_VENV="$RUNNER_TEMP/testflight-confirm-venv"
          python3 -m venv "$CONFIRM_VENV"
          "$CONFIRM_VENV/bin/python" -m pip install --quiet --disable-pip-version-check pyjwt cryptography requests
          "$CONFIRM_VENV/bin/python" scripts/ci/testflight-confirm.py

      - name: Generate TestFlight audit result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          IPA_PRESENT=false
          IPA_VALIDATED=false
          UPLOAD_ACCEPTED=false
          BUILD_VISIBLE=false
          test -f AcuarioNexo-TestFlight.ipa && IPA_PRESENT=true
          test -f ipa-validation.txt && grep -q '^codesign=verified$' ipa-validation.txt && grep -q '^signed_app_aps_environment=production$' ipa-validation.txt && grep -q '^appdelegate_registration_callback=verified$' ipa-validation.txt && IPA_VALIDATED=true
          test -f app-store-connect-upload.log && grep -Eq 'UPLOAD SUCCEEDED|No errors uploading' app-store-connect-upload.log && UPLOAD_ACCEPTED=true
          test -f testflight-build-confirmation.json && BUILD_VISIBLE=true
          printf '{\n  "status": "%s",\n  "commit": "%s",\n  "run_id": "%s",\n  "bundle_id": "%s",\n  "marketing_version": "%s",\n  "build_number": "%s",\n  "ipa_present": %s,\n  "ipa_validated": %s,\n  "upload_accepted": %s,\n  "build_visible_in_app_store_connect": %s,\n  "automatic_git_commit": false,\n  "automatic_git_push": false,\n  "writes_to_main": false\n}\n' \
            "${{ job.status }}" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$BUNDLE_ID" "${MARKETING_VERSION:-}" "${BUILD_NUMBER:-}" \
            "$IPA_PRESENT" "$IPA_VALIDATED" "$UPLOAD_ACCEPTED" "$BUILD_VISIBLE" > testflight-build-status.json

      - name: Upload IPA and complete audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AUDIT_ARTIFACT }}
          path: |
            AcuarioNexo-TestFlight.ipa
            AcuarioNexo-TestFlight.ipa.sha256
            testflight-build-status.json
            testflight-build-confirmation.json
            credentials-preflight.txt
            distribution-certificate-audit.txt
            provisioning-profile-audit.txt
            signing-identities.txt
            push-entitlement-audit.txt
            push-appdelegate-audit.txt
            ipa-validation.txt
            ipa-codesign-verification.txt
            ipa-entitlements-command.txt
            app-store-connect-upload.log
            app-store-connect-key-audit.txt
            ios-identity.txt
            ios-version.txt
            ios-project-list.txt
            xcode-version.txt
            ios-sdk-version.txt
            testflight-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Clean all temporary credentials
        if: always()
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set +e
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          test -n "${PROFILE_UUID:-}" && rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          test -n "${KEYCHAIN_PATH:-}" && security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null
          rm -f "$RUNNER_TEMP/AcuarioNexo_Distribution.p12"
          rm -f "$RUNNER_TEMP/AcuarioNexo_App_Store.mobileprovision"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/*.pem "$RUNNER_TEMP"/*.plist
          rm -rf "$RUNNER_TEMP/testflight-confirm-venv"
          echo "All temporary signing credentials removed." > credentials-cleanup.txt

      - name: Verify credential cleanup
        if: always()
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          test ! -e "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          test ! -e "$RUNNER_TEMP/AcuarioNexo_Distribution.p12"
          test ! -e "$RUNNER_TEMP/AcuarioNexo_App_Store.mobileprovision"
          test ! -e "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          test ! -e "$RUNNER_TEMP/testflight-confirm-venv"
          echo "Credential cleanup verified." >> credentials-cleanup.txt