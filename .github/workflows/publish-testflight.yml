name: Publish AcuarioNexo to TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: App Store marketing version
        required: true
        default: '1.0'
      build_number:
        description: Optional numeric build number; defaults to the GitHub run number
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: acuarionexo-testflight
  cancel-in-progress: false

env:
  APP_NAME: AcuarioNexo
  BUNDLE_ID: com.acuarionexo.app
  TEAM_ID: 636BUY8Z9W
  XCODE_PROJECT: ios/App/App.xcodeproj
  XCODE_SCHEME: App
  ARCHIVE_PATH: ios-build/AcuarioNexo.xcarchive
  EXPORT_PATH: ios-build/export
  AUDIT_ARTIFACT: AcuarioNexo-TestFlight-Audit

jobs:
  publish-testflight:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version | tee xcode-version.txt

      - name: Validate required secrets
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          DIST_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for required in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY DIST_P12_BASE64 DIST_P12_PASSWORD PROFILE_BASE64; do
            if [ -z "${!required:-}" ]; then
              echo "Missing required GitHub Actions secret: ${required}" >&2
              exit 1
            fi
          done
          echo "All required secret values are present." > secrets-presence-check.txt

      - name: Install dependencies
        run: npm install

      - name: Validate complete web application
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee testflight-build.log

      - name: Prepare and validate mobile bundle
        shell: bash
        run: |
          set -o pipefail
          npm run mobile:prepare 2>&1 | tee -a testflight-build.log
          npm run mobile:check 2>&1 | tee -a testflight-build.log

      - name: Generate iOS project from source assets
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf ios ios-build
          mkdir -p ios-build
          npx cap add ios 2>&1 | tee -a testflight-build.log
          npm run mobile:assets:prepare 2>&1 | tee -a testflight-build.log
          npx --yes @capacitor/assets@3.0.5 generate --ios --iconBackgroundColor '#02111f' --splashBackgroundColor '#02111f' 2>&1 | tee -a testflight-build.log
          npx cap sync ios 2>&1 | tee -a testflight-build.log

      - name: Verify generated iOS identity
        shell: bash
        run: |
          set -euo pipefail
          test -f "$XCODE_PROJECT/project.pbxproj"
          test -f ios/App/App/Info.plist
          xcodebuild -project "$XCODE_PROJECT" -list | tee ios-project-list.txt
          grep -F "$BUNDLE_ID" "$XCODE_PROJECT/project.pbxproj"
          grep -Eq '^[[:space:]]*App$' ios-project-list.txt
          cat > ios-identity.txt <<EOF_IDENTITY
          project=$XCODE_PROJECT
          scheme=$XCODE_SCHEME
          target=App
          bundle_id=$BUNDLE_ID
          team_id=$TEAM_ID
          EOF_IDENTITY

      - name: Install distribution certificate and provisioning profile
        id: signing
        shell: bash
        env:
          DIST_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/AcuarioNexo_Distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/AcuarioNexo_App_Store.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/acuarionexo-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$DIST_P12_BASE64" | tr -d '\r\n ' | openssl base64 -d -A -out "$CERT_PATH"
          printf '%s' "$PROFILE_BASE64" | tr -d '\r\n ' | openssl base64 -d -A -out "$PROFILE_PATH"
          test -s "$CERT_PATH"
          test -s "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | tee signing-identities.txt
          grep -F 'Apple Distribution' signing-identities.txt

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")

          test "$PROFILE_APP_ID" = "$TEAM_ID.$BUNDLE_ID"
          test "$PROFILE_TEAM_ID" = "$TEAM_ID"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          {
            echo "profile_uuid=$PROFILE_UUID"
            echo "profile_name=$PROFILE_NAME"
            echo "keychain_path=$KEYCHAIN_PATH"
          } >> "$GITHUB_OUTPUT"

          cat > provisioning-profile-audit.txt <<EOF_PROFILE
          name=$PROFILE_NAME
          uuid=$PROFILE_UUID
          application_identifier=$PROFILE_APP_ID
          team_id=$PROFILE_TEAM_ID
          EOF_PROFILE

      - name: Resolve version and build
        id: version
        shell: bash
        env:
          REQUESTED_BUILD: ${{ inputs.build_number }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${REQUESTED_BUILD:-$GITHUB_RUN_NUMBER}"
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          printf 'marketing_version=%s\nbuild_number=%s\n' "$MARKETING_VERSION" "$BUILD_NUMBER" > ios-version.txt

      - name: Archive signed application
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.profile_name }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${{ steps.signing.outputs.keychain_path }}" \
            clean archive 2>&1 | tee -a testflight-build.log
          test -d "$ARCHIVE_PATH"

      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_PATH"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF_EXPORT
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>${{ steps.signing.outputs.profile_name }}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF_EXPORT

          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${{ steps.signing.outputs.keychain_path }}" \
            2>&1 | tee -a testflight-build.log

          IPA_PATH=$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          cp "$IPA_PATH" AcuarioNexo-TestFlight.ipa

      - name: Validate IPA signature, bundle, version and build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ipa-validation"
          mkdir -p "$RUNNER_TEMP/ipa-validation"
          ditto -x -k AcuarioNexo-TestFlight.ipa "$RUNNER_TEMP/ipa-validation"
          APP_PATH=$(find "$RUNNER_TEMP/ipa-validation/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH" 2>&1 | tee ipa-codesign-verification.txt
          IPA_BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")
          IPA_VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP_PATH/Info.plist")
          IPA_BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP_PATH/Info.plist")
          test "$IPA_BUNDLE" = "$BUNDLE_ID"
          test "$IPA_VERSION" = "${{ steps.version.outputs.marketing_version }}"
          test "$IPA_BUILD" = "${{ steps.version.outputs.build_number }}"
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$RUNNER_TEMP/embedded-profile.plist"
          EMBEDDED_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/embedded-profile.plist")
          test "$EMBEDDED_APP_ID" = "$TEAM_ID.$BUNDLE_ID"
          shasum -a 256 AcuarioNexo-TestFlight.ipa | tee AcuarioNexo-TestFlight.ipa.sha256
          cat > ipa-validation.txt <<EOF_IPA
          ipa=AcuarioNexo-TestFlight.ipa
          bundle_id=$IPA_BUNDLE
          marketing_version=$IPA_VERSION
          build_number=$IPA_BUILD
          embedded_application_identifier=$EMBEDDED_APP_ID
          codesign=verified
          EOF_IPA

      - name: Install App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ASC_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$ASC_KEYS_DIR"
          chmod 700 "$HOME/.appstoreconnect" "$ASC_KEYS_DIR"
          printf '%s' "$ASC_PRIVATE_KEY" > "$ASC_KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$ASC_KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "api_key_path=$ASC_KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8" > app-store-connect-key-audit.txt

      - name: Upload IPA to App Store Connect
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          set -o pipefail
          xcrun altool --upload-app \
            --type ios \
            --file AcuarioNexo-TestFlight.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee app-store-connect-upload.log
          grep -Eq 'UPLOAD SUCCEEDED|No errors uploading' app-store-connect-upload.log

      - name: Confirm build appears in App Store Connect
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          EXPECTED_BUILD: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyjwt cryptography requests
          python3 <<'PY'
          import json
          import os
          import time
          import jwt
          import requests

          key_id = os.environ['ASC_KEY_ID']
          issuer_id = os.environ['ASC_ISSUER_ID']
          private_key = os.environ['ASC_PRIVATE_KEY']
          bundle_id = os.environ['BUNDLE_ID']
          expected_build = os.environ['EXPECTED_BUILD']

          def token():
              now = int(time.time())
              return jwt.encode(
                  {'iss': issuer_id, 'iat': now, 'exp': now + 900, 'aud': 'appstoreconnect-v1'},
                  private_key,
                  algorithm='ES256',
                  headers={'kid': key_id, 'typ': 'JWT'},
              )

          def get(path, params):
              response = requests.get(
                  f'https://api.appstoreconnect.apple.com{path}',
                  headers={'Authorization': f'Bearer {token()}'},
                  params=params,
                  timeout=30,
              )
              response.raise_for_status()
              return response.json()

          apps = get('/v1/apps', {'filter[bundleId]': bundle_id, 'limit': 5})['data']
          if len(apps) != 1:
              raise SystemExit(f'Expected one App Store Connect app for {bundle_id}, found {len(apps)}')
          app_id = apps[0]['id']

          deadline = time.time() + 1800
          found = None
          while time.time() < deadline:
              builds = get('/v1/builds', {
                  'filter[app]': app_id,
                  'filter[version]': expected_build,
                  'sort': '-uploadedDate',
                  'limit': 10,
              })['data']
              if builds:
                  found = builds[0]
                  break
              time.sleep(30)

          if not found:
              raise SystemExit(f'Build {expected_build} did not appear in App Store Connect within 30 minutes')

          result = {
              'app_store_connect_app_id': app_id,
              'bundle_id': bundle_id,
              'build_id': found['id'],
              'build_number': found['attributes'].get('version'),
              'processing_state': found['attributes'].get('processingState'),
              'uploaded_date': found['attributes'].get('uploadedDate'),
              'appears_in_app_store_connect': True,
          }
          with open('testflight-build-confirmation.json', 'w', encoding='utf-8') as handle:
              json.dump(result, handle, indent=2)
          print(json.dumps(result, indent=2))
          PY

      - name: Generate TestFlight audit result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS="${{ job.status }}"
          IPA_PRESENT=false
          IPA_VALIDATED=false
          UPLOAD_ACCEPTED=false
          BUILD_VISIBLE=false
          test -f AcuarioNexo-TestFlight.ipa && IPA_PRESENT=true
          test -f ipa-validation.txt && grep -q '^codesign=verified$' ipa-validation.txt && IPA_VALIDATED=true
          test -f app-store-connect-upload.log && grep -Eq 'UPLOAD SUCCEEDED|No errors uploading' app-store-connect-upload.log && UPLOAD_ACCEPTED=true
          test -f testflight-build-confirmation.json && BUILD_VISIBLE=true
          cat > testflight-build-status.json <<EOF_STATUS
          {
            "status": "$STATUS",
            "commit": "$GITHUB_SHA",
            "run_id": "$GITHUB_RUN_ID",
            "workflow": "publish-testflight.yml",
            "project": "$XCODE_PROJECT",
            "scheme": "$XCODE_SCHEME",
            "target": "App",
            "bundle_id": "$BUNDLE_ID",
            "marketing_version": "${{ steps.version.outputs.marketing_version }}",
            "build_number": "${{ steps.version.outputs.build_number }}",
            "ipa_present": $IPA_PRESENT,
            "ipa_validated": $IPA_VALIDATED,
            "upload_accepted": $UPLOAD_ACCEPTED,
            "build_visible_in_app_store_connect": $BUILD_VISIBLE,
            "automatic_git_commit": false,
            "automatic_git_push": false,
            "writes_to_main": false
          }
          EOF_STATUS

      - name: Upload IPA and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AUDIT_ARTIFACT }}
          path: |
            AcuarioNexo-TestFlight.ipa
            AcuarioNexo-TestFlight.ipa.sha256
            testflight-build-status.json
            testflight-build-confirmation.json
            ipa-validation.txt
            ipa-codesign-verification.txt
            app-store-connect-upload.log
            app-store-connect-key-audit.txt
            provisioning-profile-audit.txt
            signing-identities.txt
            secrets-presence-check.txt
            ios-identity.txt
            ios-version.txt
            ios-project-list.txt
            xcode-version.txt
            testflight-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Clean signing credentials
        if: always()
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set +e
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.signing.outputs.profile_uuid }}.mobileprovision"
          security delete-keychain "${{ steps.signing.outputs.keychain_path }}" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AcuarioNexo_Distribution.p12"
          rm -f "$RUNNER_TEMP/AcuarioNexo_App_Store.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/embedded-profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          echo "Signing credentials removed from the runner." > credentials-cleanup.txt

      - name: Verify credential cleanup
        if: always()
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          test ! -e "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if [ -n "${{ steps.signing.outputs.profile_uuid }}" ]; then
            test ! -e "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.signing.outputs.profile_uuid }}.mobileprovision"
          fi
          if [ -n "${{ steps.signing.outputs.keychain_path }}" ]; then
            test ! -e "${{ steps.signing.outputs.keychain_path }}"
          fi
          echo "Credential cleanup verified." >> credentials-cleanup.txt
