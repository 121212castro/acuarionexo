appId: com.acuarionexo.desktop
productName: AcuarioNexo
asar: true
directories:
  output: dist-desktop
files:
  - electron/**/*
  - www/**/*
  - icon-512.png
  - package.json
mac:
  category: public.app-category.utilities
  icon: icon-512.png
  target:
    - zip
  artifactName: AcuarioNexo-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  notarize: true
